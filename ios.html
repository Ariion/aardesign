<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>iOS 27 — AAR Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --sf:  -apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  --blue:#007AFF; --blue2:#0A84FF;
  --green:#30D158; --red:#FF3B30; --purple:#BF5AF2;
  --pink:#FF2D55;  --orange:#FF9F0A; --teal:#5AC8F5;
  --col:4; --icon:60px; --radius:14px;
  --dock-pad:14px 20px;
  --grid-pad:54px 10px 10px;
  --label:0.6rem;
  --di-h:36px; /* dynamic island height */
}

/* ── Tablet ── */
@media(min-width:600px){
  :root{ --col:5; --icon:68px; --radius:16px; --grid-pad:60px 16px 12px; --label:0.65rem; --di-h:0px; }
}
/* ── Desktop ── */
@media(min-width:1024px){
  :root{ --col:6; --icon:76px; --radius:18px; --grid-pad:70px 24px 14px; --label:0.68rem; }
}

html,body{
  width:100%; height:100%; overflow:hidden;
  font-family:var(--sf);
  background:#000;
  user-select:none;
}

/* ════════════════════════════════
   WALLPAPER
════════════════════════════════ */
#ios-wall{
  position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%,  rgba(120,50,220,.55) 0%, transparent 60%),
    radial-gradient(ellipse 70% 50% at 85% 15%,  rgba(0,180,255,.45)  0%, transparent 55%),
    radial-gradient(ellipse 90% 70% at 50% 50%,  rgba(30,10,80,.9)    0%, transparent 80%),
    radial-gradient(ellipse 60% 50% at 10% 85%,  rgba(255,45,85,.35)  0%, transparent 55%),
    radial-gradient(ellipse 80% 60% at 90% 90%,  rgba(100,210,100,.25) 0%, transparent 55%),
    linear-gradient(160deg, #0a0018 0%, #10002e 35%, #001a40 65%, #000810 100%);
  animation: wallshift 18s ease-in-out infinite alternate;
}
@keyframes wallshift{
  0%  { filter:hue-rotate(0deg)   brightness(1); }
  50% { filter:hue-rotate(15deg)  brightness(1.05); }
  100%{ filter:hue-rotate(-10deg) brightness(.98); }
}
/* Grain subtil */
#ios-wall::after{
  content:''; position:absolute; inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:.35; pointer-events:none;
}

/* ════════════════════════════════
   STATUS BAR
════════════════════════════════ */
#ios-status{
  position:fixed; top:0; left:0; right:0; z-index:500;
  height:50px; display:flex; align-items:flex-end;
  padding:0 22px 9px;
  justify-content:space-between;
  pointer-events:none;
}
#ios-status-time{
  font-size:.82rem; font-weight:700; color:#fff; letter-spacing:-.01em;
}
.ios-status-icons{ display:flex; align-items:center; gap:7px; }
.ios-sig{ display:flex; align-items:flex-end; gap:1.5px; }
.ios-sig span{
  width:3px; background:#fff; border-radius:1px;
  display:block;
}
.ios-sig span:nth-child(1){ height:4px; }
.ios-sig span:nth-child(2){ height:7px; }
.ios-sig span:nth-child(3){ height:10px; }
.ios-sig span:nth-child(4){ height:13px; opacity:.4; }
.ios-wifi svg{ width:16px; height:12px; fill:white; }
.ios-batt{
  width:25px; height:12px; border-radius:3px;
  border:1.5px solid rgba(255,255,255,.5); position:relative;
  display:flex; align-items:center; padding:1.5px;
}
.ios-batt::after{
  content:''; position:absolute; right:-4.5px; top:50%;
  transform:translateY(-50%); width:2.5px; height:5px;
  background:rgba(255,255,255,.45); border-radius:0 2px 2px 0;
}
.ios-batt-fill{
  background:#fff; height:100%; border-radius:1.5px; width:78%;
}

/* ── Dynamic Island (mobile seulement) ── */
#ios-di{
  position:fixed; top:11px; left:50%; transform:translateX(-50%);
  width:126px; height:var(--di-h); border-radius:20px;
  background:#000; z-index:600;
  transition:width .4s cubic-bezier(.4,0,.2,1), height .4s cubic-bezier(.4,0,.2,1);
}
@media(min-width:600px){ #ios-di{ display:none; } }

/* ════════════════════════════════
   HOME SCREEN CONTAINER
════════════════════════════════ */
#ios-home{
  position:fixed; inset:0; z-index:1;
  display:flex; flex-direction:column;
  overflow:hidden;
}

/* ── Scrollable pages ── */
#ios-pages{
  flex:1; overflow-y:auto; scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
  padding:var(--grid-pad);
  display:flex; flex-direction:column; gap:2rem;
}
#ios-pages::-webkit-scrollbar{ display:none; }

/* Page */
.ios-page{
  scroll-snap-align:start; flex-shrink:0;
}

/* ── Icon grid ── */
.ios-grid{
  display:grid;
  grid-template-columns:repeat(var(--col),1fr);
  gap:.5rem 0;
}

/* ── App icon ── */
.ios-icon{
  display:flex; flex-direction:column; align-items:center;
  gap:.35rem; cursor:pointer; position:relative;
  padding:.2rem 0;
}
.ios-icon-face{
  width:var(--icon); height:var(--icon);
  border-radius:var(--radius);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 14px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .14s cubic-bezier(.4,0,.2,1), box-shadow .14s;
  overflow:hidden; position:relative; flex-shrink:0;
}
.ios-icon-face::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(160deg, rgba(255,255,255,.18) 0%, transparent 60%);
  border-radius:inherit; pointer-events:none;
}
.ios-icon:active .ios-icon-face{
  transform:scale(.86);
  box-shadow:0 1px 6px rgba(0,0,0,.3);
}
.ios-icon-face svg{ width:calc(var(--icon)*.5); height:calc(var(--icon)*.5); }
.ios-icon-face img{ width:100%; height:100%; object-fit:cover; }
.ios-icon-label{
  font-size:var(--label); font-weight:400; color:#fff;
  text-align:center; text-shadow:0 1px 4px rgba(0,0,0,.8);
  max-width:calc(var(--icon)+10px);
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  line-height:1.2;
}

/* ── Page dots ── */
#ios-dots{
  display:flex; justify-content:center; gap:6px;
  padding:6px 0 4px; z-index:2; flex-shrink:0;
}
.ios-dot{
  width:7px; height:7px; border-radius:50%;
  background:rgba(255,255,255,.35); transition:all .2s;
}
.ios-dot.active{ background:#fff; width:18px; border-radius:4px; }

/* ════════════════════════════════
   DOSSIER ICON
════════════════════════════════ */
.ios-folder-face{
  width:var(--icon); height:var(--icon);
  border-radius:var(--radius);
  background:rgba(255,255,255,.2);
  backdrop-filter:blur(20px) saturate(160%);
  border:1px solid rgba(255,255,255,.25);
  display:grid; grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr; gap:3px; padding:8px;
  box-shadow:0 3px 14px rgba(0,0,0,.4);
  transition:transform .14s cubic-bezier(.4,0,.2,1);
  flex-shrink:0; overflow:hidden; position:relative;
}
.ios-folder-face::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(160deg, rgba(255,255,255,.18) 0%, transparent 60%);
  border-radius:inherit; pointer-events:none;
}
.ios-icon:active .ios-folder-face{ transform:scale(.86); }
.ios-fm{
  border-radius:4px; display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.ios-fm svg{ width:11px; height:11px; }

/* ════════════════════════════════
   DOCK
════════════════════════════════ */
#ios-dock{
  flex-shrink:0; display:flex; justify-content:center;
  padding:10px 16px 28px;
}
@media(min-width:600px){ #ios-dock{ padding:10px 20px 20px; } }
.ios-dock-inner{
  display:flex; gap:14px; align-items:flex-end;
  background:rgba(255,255,255,.14);
  backdrop-filter:blur(40px) saturate(180%);
  border:1px solid rgba(255,255,255,.2);
  border-radius:30px; padding:12px 18px;
  box-shadow:0 8px 32px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.12);
}
@media(min-width:600px){ .ios-dock-inner{ gap:18px; padding:14px 24px; border-radius:36px; } }
.ios-dock-inner .ios-icon-face{
  width:calc(var(--icon)*1.05); height:calc(var(--icon)*1.05);
}

/* ════════════════════════════════
   HOME INDICATOR
════════════════════════════════ */
#ios-hi{
  position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
  width:135px; height:5px; background:rgba(255,255,255,.4);
  border-radius:3px; z-index:600;
}
@media(min-width:600px){ #ios-hi{ display:none; } }

/* ════════════════════════════════
   FOLDER POPUP
════════════════════════════════ */
#ios-folder-popup{
  position:fixed; inset:0; z-index:800;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(28px) saturate(160%);
  opacity:0; pointer-events:none;
  transition:opacity .3s cubic-bezier(.4,0,.2,1);
}
#ios-folder-popup.open{
  opacity:1; pointer-events:auto;
}
.ios-fp-card{
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(40px) saturate(200%);
  border:1px solid rgba(255,255,255,.28);
  border-radius:24px; padding:20px;
  width:min(300px, 90vw);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  transform:scale(.88) translateY(20px);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
#ios-folder-popup.open .ios-fp-card{
  transform:scale(1) translateY(0);
}
.ios-fp-title{
  color:#fff; font-size:.8rem; font-weight:600; text-align:center;
  margin-bottom:14px; letter-spacing:.01em;
}
.ios-fp-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
  justify-items:center;
}
.ios-fp-btn{
  background:rgba(255,255,255,.18); border:none; color:#fff;
  font-size:.82rem; font-weight:600; cursor:pointer;
  width:46px; height:46px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  margin:14px auto 0; display:flex;
  backdrop-filter:blur(12px);
  transition:background .2s;
}
.ios-fp-btn:hover{ background:rgba(255,255,255,.28); }

/* ════════════════════════════════
   APP LAYER (fullscreen)
════════════════════════════════ */
#ios-app-layer{
  position:fixed; inset:0; z-index:700;
  display:flex; flex-direction:column;
  transform:translateY(105%);
  transition:transform .4s cubic-bezier(.4,0,.2,1);
  background:#f2f2f7;
  border-radius:0;
}
#ios-app-layer.open{
  transform:translateY(0);
  border-radius:0;
}

/* Barre de navigation app */
.ios-app-topbar{
  display:flex; align-items:flex-end; height:80px;
  padding:0 16px 12px;
  background:rgba(248,248,248,.95);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,0,0,.08);
  flex-shrink:0; position:relative; z-index:2;
}
@media(min-width:600px){ .ios-app-topbar{ height:60px; padding:0 24px 10px; } }
.ios-app-back{
  display:flex; align-items:center; gap:3px;
  background:none; border:none; color:var(--blue); cursor:pointer;
  font:400 .9rem/1 var(--sf); padding:.2rem 0;
}
.ios-app-back svg{ width:20px; height:20px; }
.ios-app-title{
  position:absolute; left:0; right:0; bottom:12px;
  text-align:center; font:.6rem/.9rem var(--sf);
  font-size:.9rem; font-weight:600; color:#1a1a1a;
  pointer-events:none;
}
.ios-app-scroll{
  flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.ios-app-scroll::-webkit-scrollbar{ display:none; }

/* ════════════════════════════════
   BOUTON RETOUR ACCUEIL
════════════════════════════════ */
#ios-back-home{
  position:fixed; bottom:40px; right:20px; z-index:900;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.3);
  color:#fff; font:600 .72rem var(--sf);
  padding:.55rem 1.1rem; border-radius:20px; cursor:pointer;
  white-space:nowrap; box-shadow:0 4px 16px rgba(0,0,0,.3);
  transition:background .2s, transform .15s;
}
#ios-back-home:active{ transform:scale(.95); }
@media(min-width:600px){ #ios-back-home{ bottom:30px; right:32px; } }

/* ════════════════════════════════
   CONTENU DES APPS
════════════════════════════════ */

/* Common card */
.ac{ background:#fff; border-radius:16px; margin:12px 16px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.07); }
@media(min-width:600px){ .ac{ margin:16px 24px; } }
.ac-head{ padding:14px 16px 10px; font-size:.72rem; font-weight:600; color:#8e8e93; text-transform:uppercase; letter-spacing:.06em; }
.ac-row{ display:flex; align-items:center; gap:12px; padding:12px 16px; border-top:1px solid #f2f2f7; }
.ac-ico{ width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ac-ico svg{ width:18px; height:18px; }
.ac-info{ flex:1; }
.ac-lbl{ font-size:.7rem; color:#8e8e93; }
.ac-val{ font-size:.85rem; font-weight:500; color:#1c1c1e; }
.ac-action{ font-size:.75rem; color:var(--blue); font-weight:500; cursor:pointer; white-space:nowrap; }
.ac-action a{ color:var(--blue); text-decoration:none; }

/* CV */
.cv-hero{ background:linear-gradient(135deg,#1B3560,#29B8D9); padding:28px 20px; display:flex; align-items:center; gap:16px; }
.cv-hero-ava{ width:72px; height:72px; border-radius:16px; overflow:hidden; border:2px solid rgba(255,255,255,.3); flex-shrink:0; }
.cv-hero-ava img{ width:100%; height:100%; object-fit:cover; }
.cv-hero-name{ font-size:1.2rem; font-weight:700; color:#fff; }
.cv-hero-role{ font-size:.72rem; color:rgba(255,255,255,.8); margin-top:3px; }
.cv-chips{ display:flex; flex-wrap:wrap; gap:6px; padding:12px 16px 6px; }
.cv-chip{ background:#f2f2f7; border-radius:20px; padding:4px 10px; font-size:.65rem; color:#444; }
.cv-section{ padding:0 16px 12px; }
.cv-section-title{ font-size:.7rem; font-weight:700; color:#8e8e93; text-transform:uppercase; letter-spacing:.08em; padding:14px 0 8px; }
.cv-skill{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.cv-skill-name{ font-size:.72rem; width:110px; flex-shrink:0; color:#1c1c1e; }
.cv-skill-bar{ flex:1; height:5px; background:#e5e5ea; border-radius:3px; overflow:hidden; }
.cv-skill-fill{ height:100%; background:linear-gradient(90deg,#1B3560,#29B8D9); border-radius:3px; }
.cv-skill-pct{ font-size:.62rem; color:#8e8e93; width:32px; text-align:right; }
.cv-timeline-item{ display:flex; gap:12px; padding:8px 0; border-bottom:1px solid #f2f2f7; }
.cv-tl-dot{ width:10px; height:10px; border-radius:50%; background:var(--blue); flex-shrink:0; margin-top:4px; }
.cv-tl-title{ font-size:.78rem; font-weight:600; color:#1c1c1e; }
.cv-tl-sub{ font-size:.65rem; color:var(--blue); font-weight:500; }
.cv-tl-desc{ font-size:.65rem; color:#8e8e93; }
.cv-lang-row{ display:flex; flex-wrap:wrap; gap:8px; }
.cv-lang{ background:#f2f2f7; border-radius:12px; padding:6px 12px; text-align:center; }
.cv-lang-name{ font-size:.72rem; font-weight:600; color:#1c1c1e; }
.cv-lang-lvl{ font-size:.58rem; color:#8e8e93; }

/* Atelier */
.atl-header{ background:linear-gradient(135deg,#1B3560,#0097BA); padding:24px 20px; }
.atl-header-title{ font-size:1.3rem; font-weight:800; color:#fff; }
.atl-header-sub{ font-size:.72rem; color:rgba(255,255,255,.75); margin-top:4px; }
.atl-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px 16px; }
@media(min-width:600px){ .atl-grid{ grid-template-columns:repeat(3,1fr); } }
.atl-img{ aspect-ratio:4/3; border-radius:12px; overflow:hidden; cursor:pointer; }
.atl-img img{ width:100%; height:100%; object-fit:cover; transition:transform .3s; display:block; }
.atl-img:active img{ transform:scale(.96); }

/* Mail */
.ml-compose{ padding:16px; }
.ml-field{ margin-bottom:12px; }
.ml-field label{ font-size:.65rem; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:#8e8e93; display:block; margin-bottom:4px; }
.ml-field input,.ml-field textarea{
  width:100%; border:1px solid #e5e5ea; border-radius:10px;
  padding:10px 12px; font:400 .85rem var(--sf); color:#1c1c1e; background:#fff;
  outline:none; transition:border-color .2s;
}
.ml-field textarea{ height:120px; resize:none; }
.ml-field input:focus,.ml-field textarea:focus{ border-color:var(--blue); }
.ml-send{
  width:100%; padding:13px; border-radius:13px; border:none;
  background:var(--blue); color:#fff; font:600 .9rem var(--sf);
  cursor:pointer; transition:opacity .2s;
}
.ml-send:active{ opacity:.8; }

/* About */
.ab-hero{ background:linear-gradient(135deg,#1B3560,#8b5cf6); padding:28px 20px; text-align:center; }
.ab-ava{ width:80px; height:80px; border-radius:20px; overflow:hidden; margin:0 auto 12px; border:2px solid rgba(255,255,255,.3); }
.ab-ava img{ width:100%; height:100%; object-fit:cover; }
.ab-name{ font-size:1.25rem; font-weight:700; color:#fff; }
.ab-role{ font-size:.72rem; color:rgba(255,255,255,.8); margin-top:4px; }
.ab-stats{ display:flex; gap:1px; background:rgba(255,255,255,.1); border-radius:16px; overflow:hidden; margin:16px 16px 0; }
.ab-stat{ flex:1; padding:12px 8px; text-align:center; background:rgba(255,255,255,.06); }
.ab-stat-n{ font-size:1.2rem; font-weight:700; color:#fff; }
.ab-stat-l{ font-size:.58rem; color:rgba(255,255,255,.65); }
.ab-text{ font-size:.82rem; line-height:1.7; color:#444; padding:16px 20px; }
</style>
</head>
<body>

<!-- WALLPAPER -->
<div id="ios-wall"></div>

<!-- DYNAMIC ISLAND (mobile) -->
<div id="ios-di"></div>

<!-- STATUS BAR -->
<div id="ios-status">
  <span id="ios-status-time">9:41</span>
  <div class="ios-status-icons">
    <div class="ios-sig">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="ios-wifi">
      <svg viewBox="0 0 24 18"><path d="M12 15a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm0-4.5a6 6 0 0 1 4.24 1.76l1.42-1.42A8 8 0 0 0 12 9a8 8 0 0 0-5.66 2.34l1.42 1.42A6 6 0 0 1 12 10.5zm0-4.5a10.5 10.5 0 0 1 7.42 3.08l1.42-1.42A12.5 12.5 0 0 0 12 4.5a12.5 12.5 0 0 0-8.84 3.66l1.42 1.42A10.5 10.5 0 0 1 12 6z"/></svg>
    </div>
    <div class="ios-batt"><div class="ios-batt-fill"></div></div>
  </div>
</div>

<!-- HOME SCREEN -->
<div id="ios-home">
  <div id="ios-pages">

    <!-- Page 1 — Apps principales -->
    <div class="ios-page">
      <div class="ios-grid" id="grid-p1">

        <!-- Atelier -->
        <div class="ios-icon" data-app="atelier">
          <div class="ios-icon-face" style="background:linear-gradient(145deg,#1B3560,#0097BA)">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </div>
          <span class="ios-icon-label">Atelier</span>
        </div>

        <!-- CV -->
        <div class="ios-icon" data-app="cv">
          <div class="ios-icon-face" style="background:linear-gradient(145deg,#1d4520,#30D158)">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6M9 11h6M9 15h4" stroke-linecap="round"/></svg>
          </div>
          <span class="ios-icon-label">CV</span>
        </div>

        <!-- Mail -->

  document.getElementById('ios-status-time').textContent=t;
}

/* ──────────────────────────────────────────
   APP OPEN / CLOSE
────────────────────────────────────────── */
const appLayer=document.getElementById('ios-app-layer');
const appContent=document.getElementById('ios-app-content');
const appTitle=document.getElementById('ios-app-title');

function openApp(id){
  const app=APPS[id]; if(!app) return;
  appTitle.textContent=app.title;
  appContent.innerHTML=app.build();
  appLayer.classList.add('open');
  // Wire mail form
  const btn=document.getElementById('ml-send');
  if(btn) btn.addEventListener('click',()=>{
    document.getElementById('ml-ok').style.display='block';
    btn.style.display='none';
  });
}

document.getElementById('ios-app-back').addEventListener('click',()=>{
  appLayer.classList.remove('open');
  setTimeout(()=>{ appContent.innerHTML=''; },420);
});

/* ──────────────────────────────────────────
   ICON CLICKS
────────────────────────────────────────── */
document.querySelectorAll('.ios-icon[data-app]').forEach(el=>{
  el.addEventListener('click',()=> openApp(el.dataset.app));
});
document.querySelectorAll('.ios-icon[data-ext]').forEach(el=>{
  el.addEventListener('click',()=> window.open(el.dataset.ext,'_blank'));
});

/* ──────────────────────────────────────────
   FOLDER POPUP
────────────────────────────────────────── */
const folderPopup=document.getElementById('ios-folder-popup');
const fpTitle=document.getElementById('ios-fp-title');
const fpGrid=document.getElementById('ios-fp-grid');

document.querySelectorAll('.ios-icon[data-folder]').forEach(el=>{
  el.addEventListener('click',()=>{
    const fd=FOLDERS[el.dataset.folder]; if(!fd) return;
    fpTitle.textContent=fd.title;
    fpGrid.innerHTML=fd.items.map(it=>`
      <div class="ios-icon" style="cursor:pointer" data-fp-app="${it.app}">
        <div class="ios-icon-face" style="background:${it.bg};width:52px;height:52px;border-radius:12px">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" width="22" height="22"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </div>
        <span class="ios-icon-label" style="font-size:.58rem">${it.label}</span>
      </div>`).join('');
    folderPopup.classList.add('open');
    folderPopup.querySelectorAll('[data-fp-app]').forEach(b=>{
      b.addEventListener('click',()=>{ folderPopup.classList.remove('open'); setTimeout(()=>openApp(b.dataset.fpApp),150); });
    });
  });
});

document.getElementById('ios-fp-close').addEventListener('click',()=> folderPopup.classList.remove('open'));
folderPopup.addEventListener('click',e=>{ if(e.target===folderPopup) folderPopup.classList.remove('open'); });

document.querySelectorAll('[data-app="admin"]').forEach(el=>{

});
document.getElementById('ios-admin-cancel').addEventListener('click',()=>{ adminOverlay.style.display='none'; });
document.getElementById('ios-admin-submit').addEventListener('click',()=>{
  const v=document.getElementById('ios-admin-pwd').value;
  if(v===ADMIN_PWD){ sessionStorage.setItem('aar-auth','1'); window.location.href='admin.html'; }
  else{ document.getElementById('ios-admin-err').style.display='block'; }
});
document.getElementById('ios-admin-pwd').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('ios-admin-submit').click();
});
