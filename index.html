<style>

:root{
--navy:#1B3560; --cyan:#29B8D9; --cyan2:#0097BA;
--tb:64px;
--theme-transition:.35s cubic-bezier(.4,0,.2,1);


--wall-a:#050b18; --wall-b:#071228;
--desk-a:#050b18; --desk-b:#071228;
--desk-img:none;
--bar-bg:rgba(6,11,24,.82);
--bar-border:rgba(41,184,217,.13);
--ink:#dde8f6; --mid:#5c7899; --line:rgba(255,255,255,.055);
--win-bg:rgba(10,17,40,.88);
--win-bar:rgba(7,12,30,.92);
--win-border:rgba(41,184,217,.2);
--win-shadow:0 24px 64px rgba(0,0,0,.55),0 0 0 1px rgba(41,184,217,.08);
--icon-bg:rgba(41,184,217,.07); --icon-hover:rgba(41,184,217,.14);
--folder-bg:rgba(27,53,96,.45); --folder-hover:rgba(27,53,96,.75);
--skill-bg:rgba(41,184,217,.12); --skill-fill:linear-gradient(90deg,var(--cyan2),var(--cyan));
--chip-bg:rgba(41,184,217,.09); --chip-c:var(--cyan);
--scroll-thumb:rgba(41,184,217,.2);
}

[data-theme="light"]{
--wall-a:#f5f7fa; --wall-b:#edf0f6;
--desk-a:#f5f7fa; --desk-b:#edf0f6;
--bar-bg:rgba(255,255,255,.82);
--bar-border:rgba(27,53,96,.1);
--ink:#12254d; --mid:#6278a0; --line:rgba(27,53,96,.07);
--win-bg:rgba(255,255,255,.96);
--win-bar:rgba(245,248,255,.98);
--win-border:rgba(27,53,96,.09);
--win-shadow:0 16px 48px rgba(18,37,77,.12),0 2px 8px rgba(18,37,77,.06);
--icon-bg:rgba(27,53,96,.06); --icon-hover:rgba(27,53,96,.11);
--folder-bg:rgba(27,53,96,.06); --folder-hover:rgba(27,53,96,.12);
--skill-bg:rgba(27,53,96,.07); --skill-fill:linear-gradient(90deg,var(--navy),var(--cyan2));
--chip-bg:rgba(27,53,96,.07); --chip-c:var(--navy);
--scroll-thumb:rgba(27,53,96,.18);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased}
html{transition:color-scheme var(--theme-transition)}
body{background:var(--wall-a);color:var(--ink);transition:background var(--theme-transition),color var(--theme-transition);user-select:none}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:4px}

:root{ --wall-a:#060d1f; --wall-b:#040914; }
[data-theme="light"]{ --wall-a:#f5f7fa; --wall-b:#edf0f7; }

#wall{
position:fixed;inset:0;z-index:0;
background:linear-gradient(160deg, var(--wall-a) 0%, var(--wall-b) 100%);
transition:background var(--theme-transition);
overflow:hidden;
}

/* ── Portrait en fond (façon éditoriale) ── */
#desk-portrait{
position:fixed;top:0;right:0;bottom:0;width:min(58%,960px);z-index:2;pointer-events:none;
background-repeat:no-repeat;background-position:70% 30%;background-size:auto 100%;
filter:grayscale(1) contrast(1.1) brightness(1.1);
opacity:0;transition:opacity 1.1s ease;
-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 30%);
mask-image:linear-gradient(90deg,transparent 0%,#000 30%);
}
#desk-portrait.on{opacity:1}
/* halo derrière la figure pour la faire ressortir */
#desk-portrait::before{content:'';position:absolute;right:-6%;top:6%;width:70%;height:80%;border-radius:50%;
background:radial-gradient(circle,rgba(120,130,155,.16),transparent 62%);filter:blur(30px)}
#desk-portrait::after{content:'';position:absolute;inset:0;
background:linear-gradient(90deg,var(--wall-a) 0%,rgba(6,13,31,.08) 34%,transparent 52%),
linear-gradient(0deg,var(--wall-a) 2%,transparent 24%),
linear-gradient(180deg,var(--wall-a) 0%,transparent 16%);}
[data-theme="light"] #desk-portrait::after{background:linear-gradient(90deg,var(--wall-a) 0%,transparent 52%),linear-gradient(0deg,var(--wall-a) 2%,transparent 24%)}
[data-theme="light"] #desk-portrait{filter:grayscale(1) contrast(1.02) brightness(1.02)}
@media(max-width:820px){#desk-portrait{width:100%;opacity:0!important}}

.wb{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform,opacity;opacity:.4;}

.wb1{width:80vw;height:70vh;left:-25vw;bottom:-20vh;
background:radial-gradient(circle,rgba(0,151,186,.32) 0%,transparent 70%);
animation:wb1 14s ease-in-out infinite;}
[data-theme="light"] .wb1{background:radial-gradient(circle,rgba(41,184,217,.07) 0%,transparent 70%);}
@keyframes wb1{
0%,100%{transform:translate(0,0) scale(1);}
33%{transform:translate(6vw,-8vh) scale(1.08);}
66%{transform:translate(-4vw,5vh) scale(.95);}
}

.wb2{width:70vw;height:65vh;right:-20vw;top:-15vh;
background:radial-gradient(circle,rgba(41,184,217,.18) 0%,transparent 70%);
animation:wb2 18s ease-in-out infinite;}
[data-theme="light"] .wb2{background:radial-gradient(circle,rgba(41,184,217,.05) 0%,transparent 70%);}
@keyframes wb2{
0%,100%{transform:translate(0,0) scale(1);}
40%{transform:translate(-8vw,10vh) scale(1.06);}
70%{transform:translate(4vw,-5vh) scale(.93);}
}

.wb3{width:90vw;height:80vh;left:5vw;top:10vh;
background:radial-gradient(circle,rgba(27,53,96,.55) 0%,transparent 65%);
animation:wb3 22s ease-in-out infinite;}
[data-theme="light"] .wb3{background:radial-gradient(circle,rgba(27,53,96,.04) 0%,transparent 65%);}
@keyframes wb3{
0%,100%{transform:translate(0,0) scale(1);}
50%{transform:translate(5vw,6vh) scale(1.04);}
}

.wb4{width:40vw;height:40vh;right:5vw;bottom:10vh;
background:radial-gradient(circle,rgba(0,151,186,.1) 0%,transparent 70%);
animation:wb4 16s ease-in-out infinite 3s;}
[data-theme="light"] .wb4{background:radial-gradient(circle,rgba(41,184,217,.04) 0%,transparent 70%);}
@keyframes wb4{
0%,100%{transform:translate(0,0) scale(1);}
45%{transform:translate(-6vw,-10vh) scale(1.12);}
}

#wall::before{
content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
background-size:180px 180px;
opacity:.022;
mix-blend-mode:overlay;
}
[data-theme="light"] #wall::before{opacity:.04}

#wall::after{
content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
background-image:
radial-gradient(1.5px 1.5px at 8%  15%, rgba(41,184,217,.9)  0%,transparent 100%),
radial-gradient(1px   1px   at 23% 72%, rgba(41,184,217,.6)  0%,transparent 100%),
radial-gradient(1px   1px   at 46% 38%, rgba(255,255,255,.5) 0%,transparent 100%),
radial-gradient(2px   2px   at 72% 18%, rgba(41,184,217,.8)  0%,transparent 100%),
radial-gradient(1px   1px   at 91% 55%, rgba(255,255,255,.4) 0%,transparent 100%),
radial-gradient(1.5px 1.5px at 58% 83%, rgba(41,184,217,.55) 0%,transparent 100%),
radial-gradient(1px   1px   at 35% 5%,  rgba(255,255,255,.6) 0%,transparent 100%),
radial-gradient(1px   1px   at 82% 90%, rgba(41,184,217,.45) 0%,transparent 100%),
radial-gradient(1px   1px   at 15% 50%, rgba(255,255,255,.3) 0%,transparent 100%),
radial-gradient(2px   2px   at 50% 25%, rgba(41,184,217,.5)  0%,transparent 100%);
animation:starTwinkle 8s ease-in-out infinite;
opacity:1;transition:opacity .4s;
}
@keyframes starTwinkle{
0%,100%{opacity:1;} 50%{opacity:.6;}
}
[data-theme="light"] #wall::after{opacity:0}

#wall-art{
position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;
}
#wall-art::before{
content:'';position:absolute;
width:min(900px,90vw);height:min(900px,90vw);
top:-30%;right:-20%;
border-radius:50%;
border:1px solid rgba(41,184,217,.07);
animation:circleBreath 20s ease-in-out infinite;
}
#wall-art::after{
content:'';position:absolute;
width:min(600px,65vw);height:min(600px,65vw);
bottom:-20%;left:-15%;
border-radius:50%;
border:1px solid rgba(41,184,217,.05);
animation:circleBreath 25s ease-in-out infinite reverse;
}
@keyframes circleBreath{
0%,100%{transform:scale(1);opacity:.7;}
50%{transform:scale(1.06);opacity:1;}
}
[data-theme="light"] #wall-art{opacity:0}
#wall-diag{display:none}

#lockscreen{
position:fixed;inset:0;z-index:999;
display:flex;flex-direction:column;align-items:center;justify-content:center;
background:var(--ls-bg);
cursor:pointer;
transition:transform .6s cubic-bezier(.4,0,.2,1),opacity .4s,background var(--theme-transition);
will-change:transform;
}
:root{
--ls-bg:
radial-gradient(ellipse 90% 70% at 20% 88%, rgba(0,151,186,.28) 0%, transparent 55%),
radial-gradient(ellipse 70% 60% at 80% 12%, rgba(27,53,96,.45) 0%, transparent 50%),
linear-gradient(150deg,#030810 0%,#061020 55%,#030810 100%);
}
[data-theme="light"]{
--ls-bg:
radial-gradient(ellipse 80% 60% at 15% 90%, rgba(41,184,217,.18) 0%, transparent 55%),
radial-gradient(ellipse 60% 50% at 85% 10%, rgba(27,53,96,.1) 0%, transparent 50%),
linear-gradient(150deg,#e8eef8 0%,#dde8f6 55%,#e4ecf8 100%);
}
#lockscreen.unlocking{transform:translateY(-100%);opacity:.7}
#ls-logo{margin-bottom:2.5rem;opacity:.75;transition:opacity var(--theme-transition)}
#ls-time{
font-size:clamp(4rem,12vw,7rem);font-weight:300;letter-spacing:-.03em;
color:var(--ls-ink,#fff);line-height:1;margin-bottom:.4rem;
text-shadow:var(--ls-time-shadow,0 0 60px rgba(41,184,217,.3));
transition:color var(--theme-transition);
}
#ls-date{font-size:.9rem;font-weight:400;color:var(--ls-mid,rgba(255,255,255,.5));letter-spacing:.04em;margin-bottom:2.5rem;transition:color var(--theme-transition)}
#ls-name{font-size:1rem;font-weight:700;letter-spacing:.12em;color:var(--ls-ink,rgba(255,255,255,.9));text-transform:uppercase;transition:color var(--theme-transition)}
#ls-role{font-size:.72rem;font-weight:400;color:var(--ls-mid,rgba(255,255,255,.45));letter-spacing:.06em;margin-top:.3rem;transition:color var(--theme-transition)}
:root{--ls-ink:rgba(255,255,255,.95);--ls-mid:rgba(255,255,255,.45);--ls-time-shadow:0 0 60px rgba(41,184,217,.3);--ls-img-filter:brightness(0) invert(1)}
[data-theme="light"]{--ls-ink:#12254d;--ls-mid:#6278a0;--ls-time-shadow:0 2px 24px rgba(27,53,96,.12);--ls-img-filter:none}
#ls-logo img{filter:var(--ls-img-filter);transition:filter var(--theme-transition)}
#ls-hint{
position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
font-size:.65rem;letter-spacing:.1em;color:var(--ls-mid);text-transform:uppercase;
display:flex;flex-direction:column;align-items:center;gap:8px;
transition:color var(--theme-transition);
}
#ls-hint::before{
content:'';width:1px;height:24px;background:linear-gradient(transparent,rgba(41,184,217,.5));
animation:pulseup 2s ease-in-out infinite;
}
@keyframes pulseup{0%,100%{opacity:.3;transform:scaleY(.7)}50%{opacity:1;transform:scaleY(1)}}
@keyframes winopen{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes winclose{from{opacity:1;transform:scale(1) translateY(0)}to{opacity:0;transform:scale(.92) translateY(8px)}}

#topbar{
position:fixed;top:0;left:0;right:0;height:64px;z-index:100;
display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px;
background:var(--bar-bg);
border-bottom:1px solid var(--bar-border);
backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
transition:background var(--theme-transition),border-color var(--theme-transition);
}

#tb-burger{
display:flex;align-items:center;justify-content:flex-start;
width:44px;height:44px;border-radius:8px;border:none;cursor:pointer;
background:none;color:var(--mid);flex-direction:column;gap:4px;padding:8px 7px;
transition:background .15s,color .15s;
}
#tb-burger:hover{background:var(--icon-hover);color:var(--ink)}
#tb-burger span{display:block;width:100%;height:2px;background:currentColor;border-radius:2px;transition:all .2s}

#tb-logo-center{
display:flex;align-items:center;justify-content:center;
}
#tb-logo-center img{height:58px;width:auto;max-width:340px;opacity:.92;filter:brightness(0) invert(1)}
[data-theme="light"] #tb-logo-center img{filter:none;opacity:.95}

#tb-right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.tb-ico-btn{
width:32px;height:32px;border-radius:6px;border:none;cursor:pointer;
background:none;color:var(--mid);display:flex;align-items:center;justify-content:center;
font-size:.85rem;transition:background .15s,color .15s;
}
.tb-ico-btn:hover{background:var(--icon-hover);color:var(--ink)}
#tb-clock{font-size:.65rem;font-weight:600;color:var(--mid);letter-spacing:.04em;white-space:nowrap}

#tb-drawer{
position:fixed;top:64px;left:0;bottom:0;width:240px;z-index:200;
background:var(--win-bg);border-right:1px solid var(--win-border);
backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
display:flex;flex-direction:column;padding:8px;gap:2px;
transform:translateX(-100%);
transition:transform .28s cubic-bezier(.4,0,.2,1),background var(--theme-transition),border-color var(--theme-transition);
box-shadow:var(--win-shadow);
}
#tb-drawer.open{transform:translateX(0)}
#tb-drawer-overlay{
position:fixed;inset:64px 0 0 0;z-index:199;
display:none;
}
#tb-drawer.open ~ #tb-drawer-overlay{display:block}
.tm-item{
display:flex;align-items:center;gap:.7rem;padding:10px 12px;
border-radius:8px;cursor:pointer;font-size:.78rem;color:var(--ink);font-weight:500;
transition:background .1s;border:none;background:none;font-family:inherit;width:100%;text-align:left;
}
.tm-item:hover{background:var(--icon-hover)}
.tm-item svg{opacity:.65;flex-shrink:0}
.tm-sep{height:1px;background:var(--line);margin:4px 0}
.tm-label{font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);padding:8px 12px 2px;font-weight:700;opacity:.6}

#theme-float{
position:fixed;bottom:22px;right:20px;left:auto;transform:none;z-index:9990;
display:none;align-items:center;gap:6px;
background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
color:var(--mid);padding:7px 14px;border-radius:30px;
font:.6rem 'Montserrat',sans-serif;font-weight:600;letter-spacing:.06em;
cursor:pointer;border:none;opacity:.5;
transition:opacity .2s,background .2s;
}
#theme-float:hover{opacity:1;background:rgba(255,255,255,.12)}
[data-theme="light"] #theme-float{
background:rgba(27,53,96,.06);border:1px solid rgba(27,53,96,.12);color:var(--mid);
}
#lang-float{
position:fixed;bottom:22px;right:132px;z-index:9990;
display:flex;align-items:center;gap:6px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
color:var(--mid);padding:7px 13px;border-radius:30px;
font:.6rem 'Montserrat',sans-serif;font-weight:700;letter-spacing:.08em;
cursor:pointer;border:none;opacity:.5;transition:opacity .2s,background .2s;
}
#lang-float:hover{opacity:1;background:rgba(255,255,255,.12)}
[data-theme="light"] #lang-float{background:rgba(27,53,96,.06);color:var(--mid)}
@media(max-width:768px){#lang-float{right:auto;left:16px;bottom:16px;opacity:.85}}
#mob-home{
display:none;
position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9998;
background:rgba(41,184,217,.18);border:1px solid rgba(41,184,217,.35);
backdrop-filter:blur(20px);color:var(--cyan);
padding:10px 28px;border-radius:30px;font-size:.7rem;font-weight:700;
letter-spacing:.06em;cursor:pointer;border:none;font-family:'Montserrat',sans-serif;
gap:8px;align-items:center;
box-shadow:0 4px 20px rgba(0,0,0,.3);
transition:opacity .2s;
}

#desktop{
position:fixed;inset:64px 0 0 0;z-index:3;
display:flex;align-items:center;justify-content:flex-start;
padding-left:clamp(34px,7vw,120px);
pointer-events:none;
}
@media(max-width:820px){#desktop{justify-content:center;padding-left:0}}

#desk-center{
display:flex;flex-direction:column;align-items:flex-start;gap:0;
pointer-events:all;
padding:30px 20px 110px;
max-width:min(54%,600px);
}
@media(max-width:820px){#desk-center{align-items:center;max-width:none}}

#desk-apps{
position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
z-index:90;
display:flex;flex-direction:row;gap:10px;
padding:14px 22px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
border:1px solid rgba(255,255,255,.13);
border-radius:26px;
box-shadow:0 8px 40px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.08) inset;
}
[data-theme="light"] #desk-apps{
background:rgba(255,255,255,.78);
border-color:rgba(27,53,96,.1);
box-shadow:0 8px 32px rgba(18,37,77,.14);
}
.d-icon{
width:82px;display:flex;flex-direction:column;align-items:center;gap:7px;
padding:10px 4px 8px;border-radius:14px;cursor:pointer;
background:none;border:none;
transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.d-icon:hover{background:none;border:none;transform:translateY(-12px) scale(1.15)}
.d-icon:active{transform:scale(.92)}
.d-icon-face{
width:62px;height:62px;border-radius:16px;display:flex;align-items:center;justify-content:center;
overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.35);
}
.d-icon-label{font-size:.68rem;font-weight:600;color:var(--ink);text-align:center;line-height:1.2;letter-spacing:.01em;opacity:.8}

.desk-section{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:26px;width:100%}
@media(max-width:820px){.desk-section{align-items:stretch}}
/* liste éditoriale des dossiers */
.desk-folder-list{display:flex;flex-direction:column;width:min(360px,84vw)}
.dfl-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 4px;cursor:pointer;
border-bottom:1px solid rgba(255,255,255,.08);
transition:padding-left .25s cubic-bezier(.4,0,.2,1),border-color .25s}
.dfl-row:hover{padding-left:12px;border-color:rgba(139,124,246,.5)}
.dfl-label{font-size:1.16rem;font-weight:500;letter-spacing:-.01em;color:rgba(236,238,244,.62);transition:color .2s}
.dfl-row:hover .dfl-label{color:#fff}
.dfl-arrow{color:#8b7cf6;opacity:0;transform:translateX(-6px);transition:opacity .2s,transform .2s;font-size:.9rem}
.dfl-row:hover .dfl-arrow{opacity:1;transform:translateX(0)}
[data-theme="light"] .dfl-row{border-color:rgba(27,53,96,.1)}
[data-theme="light"] .dfl-num{color:rgba(27,53,96,.4)}
[data-theme="light"] .dfl-label{color:rgba(27,53,96,.65)}
[data-theme="light"] .dfl-row:hover .dfl-label{color:var(--navy)}
/* dock — icônes sobres monochromes */
#desk-apps .d-icon-face{background:rgba(255,255,255,.06)!important;border:1px solid rgba(255,255,255,.12);box-shadow:none}
.d-icon:hover .d-icon-face{background:rgba(139,124,246,.22)!important;border-color:rgba(139,124,246,.5)}
[data-theme="light"] #desk-apps .d-icon-face{background:rgba(27,53,96,.06)!important;border-color:rgba(27,53,96,.12)}
.desk-section-label{
font-size:.6rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
color:var(--cyan);opacity:.55;margin-bottom:4px;
}
[data-theme="light"] .desk-section-label{opacity:.9;color:var(--navy)}
.desk-section-label.sec-perso{color:var(--mid)}
[data-theme="light"] .desk-section-label.sec-perso{color:var(--mid);opacity:.9}
/* ── Barre des tâches (fenêtres minimisées) ── */
#dock-minimized{display:none;align-items:center;gap:6px}
#dock-minimized.has-items{display:flex}
.dock-sep{width:1px;height:36px;background:rgba(255,255,255,.15);margin:0 4px;flex-shrink:0}
[data-theme="light"] .dock-sep{background:rgba(27,53,96,.15)}
.tb-win-pill{
display:flex;flex-direction:column;align-items:center;gap:4px;
width:58px;padding:6px 4px 4px;border-radius:12px;cursor:pointer;
background:none;border:none;
transition:background .15s,transform .18s cubic-bezier(.34,1.56,.64,1);
animation:pillIn .2s cubic-bezier(.34,1.56,.64,1) both;
}
.tb-win-pill:hover{background:rgba(255,255,255,.08);transform:translateY(-8px)}
[data-theme="light"] .tb-win-pill:hover{background:rgba(27,53,96,.08)}
.tb-pill-face{
width:44px;height:44px;border-radius:12px;
background:rgba(255,255,255,.1);
border:1px solid rgba(255,255,255,.12);
display:flex;align-items:center;justify-content:center;
box-shadow:0 2px 8px rgba(0,0,0,.3);
position:relative;
}
[data-theme="light"] .tb-pill-face{background:rgba(27,53,96,.08);border-color:rgba(27,53,96,.1)}
.tb-pill-face::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--cyan)}
.tb-pill-ico{width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.tb-pill-name{font-size:.5rem;font-weight:600;color:var(--ink);text-align:center;opacity:.7;white-space:nowrap;max-width:56px;overflow:hidden;text-overflow:ellipsis}
@keyframes pillIn{from{opacity:0;transform:translateY(10px) scale(.8)}to{opacity:1;transform:none}}
@keyframes pillOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(6px) scale(.85)}}

/* ── Dossiers bureau ── */
.desk-folders-row{display:flex;gap:24px;justify-content:flex-start;flex-wrap:wrap}
@media(max-width:820px){.desk-folders-row{justify-content:center}}
.d-folder{
display:flex;flex-direction:column;align-items:center;gap:8px;
width:90px;cursor:pointer;padding:10px 6px 8px;border-radius:14px;
border:1px solid transparent;
transition:background .15s,border-color .15s,transform .2s cubic-bezier(.34,1.56,.64,1);
}
.d-folder:hover{background:var(--folder-hover);border-color:var(--bar-border);transform:translateY(-6px) scale(1.04)}
.d-folder:active{transform:scale(.94)}
.d-folder-ico{
width:64px;height:64px;display:flex;align-items:center;justify-content:center;
border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.3),0 1px 0 rgba(255,255,255,.12) inset;
position:relative;overflow:hidden;flex-shrink:0;
}
.d-folder-ico::before{
content:'';position:absolute;inset:0;
background:linear-gradient(160deg,rgba(255,255,255,.18) 0%,transparent 55%);
border-radius:inherit;pointer-events:none;z-index:1;
}
.d-folder-ico svg{position:relative;z-index:2}
.d-folder-label{font-size:.68rem;font-weight:600;color:var(--ink);text-align:center;line-height:1.3;
text-shadow:0 1px 4px rgba(0,0,0,.4)}
[data-theme="light"] .d-folder-label{text-shadow:none}

.cat-grid{display:flex;flex-wrap:wrap;gap:14px;padding:20px;align-content:flex-start;overflow-y:auto;height:100%}
.cat-item{
display:flex;flex-direction:column;align-items:center;gap:8px;
width:90px;cursor:pointer;padding:10px 6px 8px;border-radius:14px;
border:1px solid transparent;
transition:background .15s,border-color .15s,transform .2s cubic-bezier(.34,1.56,.64,1);
}
.cat-item:hover{background:var(--folder-hover);border-color:var(--bar-border);transform:translateY(-6px) scale(1.04)}
.cat-item:active{transform:scale(.94)}
.cat-item-ico{
width:64px;height:64px;display:flex;align-items:center;justify-content:center;
border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.3),0 1px 0 rgba(255,255,255,.12) inset;
position:relative;overflow:hidden;flex-shrink:0;
}
.cat-item-ico::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18) 0%,transparent 55%);pointer-events:none}
.cat-item-lbl{font-size:.68rem;font-weight:600;color:var(--ink);text-align:center;line-height:1.3;
text-shadow:0 1px 4px rgba(0,0,0,.4)}
[data-theme="light"] .cat-item-lbl{text-shadow:none}

#desk-identity{
text-align:left;margin-bottom:34px;pointer-events:none;
display:flex;flex-direction:column;align-items:flex-start;gap:0;
}
@media(max-width:820px){#desk-identity{text-align:center;align-items:center}}
#desk-id-time{
font-size:clamp(3.5rem,8vw,5.5rem);font-weight:300;letter-spacing:-.03em;
color:var(--ink);line-height:1;margin-bottom:.3rem;
text-shadow:none;
}
[data-theme="light"] #desk-id-time{text-shadow:none}
#desk-id-date{font-size:.88rem;font-weight:400;color:var(--mid);letter-spacing:.03em;margin-bottom:1.8rem}
#desk-id-name{font-size:1.1rem;font-weight:800;letter-spacing:.14em;color:var(--ink);text-transform:uppercase}
[data-theme="light"] #desk-id-name{color:var(--navy)}
#desk-id-role{font-size:.75rem;font-weight:400;color:var(--mid);margin-top:.4rem;letter-spacing:.05em}

#win-layer{position:fixed;inset:36px 0 0 0;z-index:50;pointer-events:none}
.win{
position:absolute;display:flex;flex-direction:column;pointer-events:all;
background:var(--win-bg);border:1px solid var(--win-border);border-radius:12px;
box-shadow:var(--win-shadow);
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
transition:background var(--theme-transition),border-color var(--theme-transition),box-shadow var(--theme-transition);
backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
overflow:hidden;min-width:320px;min-height:200px;
animation:winopen .25s cubic-bezier(.34,1.3,.64,1) both;
transition:background var(--theme-transition),border-color var(--theme-transition);
}

@media(max-width:768px){
#theme-float{display:none!important}
.win{
position:fixed!important;
inset:64px 0 0 0!important;
width:100%!important;height:calc(100% - 64px)!important;
border-radius:0;min-width:0;min-height:0;
transform:none!important;
z-index:9999!important;
}
.win-bar{height:52px;padding:0 14px;}
.win-ctrls{display:none}
.win-btn.close-mobile{
display:flex!important;
width:36px;height:36px;border-radius:50%;border:none;
background:rgba(255,255,255,.12);cursor:pointer;
align-items:center;justify-content:center;
margin-left:auto;
}
.win-btn.close-mobile svg{opacity:1;width:14px;height:14px;color:rgba(255,255,255,.85)}
.win-resize{display:none}
.win-body{-webkit-overflow-scrolling:touch}

#mob-home{display:none;bottom:86px;padding:9px 22px;font-size:.65rem}
#desk-apps{bottom:14px;gap:2px;padding:8px 10px;border-radius:18px;}
.d-icon{width:58px;padding:6px 2px}
.d-icon-face{width:44px;height:44px;border-radius:12px}
.d-icon-label{font-size:.5rem}
.d-folder{width:72px;padding:6px 2px}
.d-folder-ico{width:46px;height:38px}
.d-folder-label{font-size:.52rem}
#desk-center{padding:12px 8px 90px;gap:0}


.cv-wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:hidden}
.cv-sidebar{
border-radius:0;overflow-y:visible;min-height:0;
padding:14px 16px 10px;
display:grid;
grid-template-columns:80px 1fr;
grid-template-rows:auto;
gap:0 12px;
align-items:start;
}
.cv-avatar{width:64px;height:64px;margin-bottom:0;grid-row:1/3}
.cv-s-name{font-size:.78rem;text-align:left;grid-column:2}
.cv-s-role{text-align:left;grid-column:2;margin-top:2px}
.cv-s-divider{display:none}
.cv-s-contact{grid-column:1/-1;margin-top:8px;margin-bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}
.cv-s-section{grid-column:1/-1;margin-top:6px;margin-bottom:2px}
.cv-s-skill{grid-column:1/-1}
.cv-skills-grid{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.cv-pdf-btn{display:flex}.win-body:has(.cv-wrap){height:calc(100% - 52px)}
.cv-main{padding:12px 14px 64px;gap:12px}
#desk-apps{margin-bottom:18px}
.desk-section{margin-bottom:6px}
#id-badge{font-size:.55rem;bottom:8px;left:8px}
}
.win-bar{
display:flex;align-items:center;gap:8px;padding:0 10px;height:38px;
background:var(--win-bar);border-bottom:1px solid var(--line);flex-shrink:0;
border-radius:12px 12px 0 0;cursor:default;
transition:background var(--theme-transition),border-color var(--theme-transition);
}
.win-icon{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.win-title{font-size:.7rem;font-weight:600;color:var(--ink);flex:1;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-ctrls{display:flex;gap:6px;align-items:center}
.win-btn{
width:13px;height:13px;border-radius:50%;border:none;cursor:pointer;
display:flex;align-items:center;justify-content:center;flex-shrink:0;
transition:filter .15s;
}
.win-btn.close{background:#ff5f57;order:-3}
.win-btn.min{background:#febc2e;order:-2}
.win-btn.max{background:#28c840;order:-1}
.win-btn svg{opacity:.6;width:8px;height:8px;color:rgba(0,0,0,.6);transition:opacity .15s}
.win-bar:hover .win-btn svg{opacity:1}
.win-body{flex:1;overflow:auto;padding:14px;font-size:.8rem;color:var(--ink);position:relative;transition:color var(--theme-transition),background var(--theme-transition)}
.win-resize{position:absolute;bottom:0;right:0;width:18px;height:18px;cursor:se-resize;z-index:2}
.win-resize::after{content:'';position:absolute;bottom:4px;right:4px;width:6px;height:6px;border-right:2px solid var(--mid);border-bottom:2px solid var(--mid);opacity:.4;border-radius:1px}
.w-toast{position:absolute;bottom:8px;right:8px;background:var(--cyan);color:#fff;font-size:.62rem;font-weight:600;padding:4px 10px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;letter-spacing:.04em}
.w-toast.show{opacity:1}

.cv-wrap{display:grid;grid-template-columns:200px 1fr;height:100%;gap:0;overflow:hidden}
.cv-sidebar{
background:linear-gradient(170deg,var(--navy) 0%,rgba(27,53,96,.85) 100%);
padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;
border-radius:0 0 0 10px;overflow-y:auto;min-height:0;
}
[data-theme="light"] .cv-sidebar{background:linear-gradient(170deg,#1B3560 0%,#244a8c 100%)}
.cv-main{padding:20px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;height:100%}
.cv-avatar{width:80px;height:80px;border-radius:50%;overflow:hidden;flex-shrink:0;border:3px solid rgba(41,184,217,.6);margin-bottom:10px}
.cv-avatar img{width:100%;height:100%;object-fit:cover;object-position:top center}
.cv-s-name{font-size:1rem;font-weight:800;color:#fff;text-align:center;letter-spacing:-.01em;line-height:1.2}
.cv-s-role{font-size:.66rem;color:rgba(41,184,217,.8);text-align:center;margin-top:4px;letter-spacing:.04em;font-weight:600;text-transform:uppercase}
.cv-s-divider{width:32px;height:1px;background:rgba(255,255,255,.15);margin:12px auto}
.cv-s-contact{width:100%;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.cv-s-row{display:flex;align-items:center;gap:7px}
.cv-s-ico{font-size:.82rem;opacity:.7;flex-shrink:0;width:14px;text-align:center}
.cv-s-val{font-size:.68rem;color:rgba(255,255,255,.75);font-weight:500;line-height:1.3;word-break:break-all}
.cv-s-link{text-decoration:none;border-radius:5px;transition:background .15s;margin:0 -4px;padding:2px 4px}
.cv-s-link:hover{background:rgba(41,184,217,.12)}
.cv-s-link:hover .cv-s-val{color:var(--cyan)}
.cv-s-section{font-size:.54rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(41,184,217,.6);margin:10px 0 6px;width:100%;text-align:left}
.cv-s-skill{margin-bottom:5px;width:100%}
.cv-s-skill-name{font-size:.66rem;font-weight:600;color:rgba(255,255,255,.8);display:flex;justify-content:space-between;margin-bottom:2px}
.cv-s-skill-name span{color:rgba(41,184,217,.7);font-size:.62rem}
.cv-s-skill-bar{height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.cv-s-skill-fill{height:100%;background:linear-gradient(90deg,var(--cyan2),var(--cyan));border-radius:2px}
.cv-pdf-btn{
margin-top:8px;width:100%;
display:flex;align-items:center;justify-content:center;gap:6px;
background:rgba(41,184,217,.15);border:1px solid rgba(41,184,217,.3);
color:rgba(255,255,255,.85);border-radius:7px;padding:7px 10px;
font:.72rem 'Montserrat',sans-serif;font-weight:700;cursor:pointer;
text-decoration:none;letter-spacing:.04em;
transition:background .15s,border-color .15s;
}
.cv-pdf-btn:hover{background:rgba(41,184,217,.28);border-color:rgba(41,184,217,.5)}
.cv-pdf-btn svg{flex-shrink:0}
.cv-m-section{font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:8px}
.cv-tl-item{display:flex;gap:10px;margin-bottom:12px;align-items:flex-start}
.cv-tl-dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);flex-shrink:0;margin-top:3px;box-shadow:0 0 6px rgba(41,184,217,.4)}
.cv-tl-title{font-size:.82rem;font-weight:700;color:var(--ink);line-height:1.3}
.cv-tl-sub{font-size:.7rem;color:var(--cyan);margin-top:1px;font-weight:600}
.cv-tl-desc{font-size:.7rem;color:var(--mid);margin-top:2px;line-height:1.5}
.cv-langs{display:flex;gap:6px;flex-wrap:wrap}
.cv-lang-pill{background:var(--icon-bg);border:1px solid var(--line);border-radius:20px;padding:5px 14px;text-align:center}
.cv-lang-pill div:first-child{font-size:.78rem;font-weight:700;color:var(--ink)}
.cv-lang-pill div:last-child{font-size:.64rem;color:var(--mid)}
.win-body:has(.cv-wrap){padding:0;overflow:hidden;display:flex;flex-direction:column;height:calc(100% - 38px)}

.w-profile{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.w-ava{width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--icon-bg);flex-shrink:0;border:2px solid var(--cyan)}
.w-ava img{width:100%;height:100%;object-fit:cover;object-position:top center}
.w-name{font-size:.95rem;font-weight:800;color:var(--ink)}
.w-role{font-size:.62rem;color:var(--mid);margin-top:2px}
.w-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.w-row:last-child{border:none}
.w-row-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--icon-bg)}
.w-row-ico svg{width:18px;height:18px}
.w-row-info{flex:1}
.w-row-lbl{font-size:.58rem;color:var(--mid);font-weight:500}
.w-row-val{font-size:.72rem;font-weight:600;color:var(--ink);margin-top:1px}
.w-row-acts{display:flex;gap:5px;flex-shrink:0}
.w-btn{font-size:.6rem;font-weight:600;padding:4px 10px;border-radius:5px;cursor:pointer;border:1px solid var(--line);background:var(--icon-bg);color:var(--ink);font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;transition:background .15s}
.w-btn:hover{background:var(--icon-hover)}
.w-btn.pri{background:var(--cyan);border-color:var(--cyan);color:#fff}
.w-btn.pri:hover{background:var(--cyan2);border-color:var(--cyan2)}

.w-field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.w-field label{font-size:.6rem;font-weight:700;color:var(--mid);letter-spacing:.04em;text-transform:uppercase}
.w-field input,.w-field textarea{background:var(--icon-bg);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:.75rem;padding:8px 10px;border-radius:6px;outline:none;transition:border-color .15s,background .4s}
.w-field input:focus,.w-field textarea:focus{border-color:var(--cyan)}

.w-send{width:100%;padding:10px;border-radius:6px;border:none;background:var(--cyan);color:#fff;font:700 .78rem 'Montserrat',sans-serif;cursor:pointer;letter-spacing:.04em;transition:background .15s}
.w-send:hover{background:var(--cyan2)}

.ab-stat{background:var(--icon-bg);border-radius:8px;padding:10px;text-align:center}
.ab-stat-n{font-size:1.1rem;font-weight:800;color:var(--cyan)}
.ab-stat-l{font-size:.6rem;color:var(--mid);margin-top:2px}
.ab-tag{background:var(--chip-bg);border-radius:4px;padding:3px 8px;font-size:.65rem;color:var(--ink)}

/* ══════════ Vue projet — SPLIT LISIBLE (A) ══════════ */
.pv-wrap{position:relative;height:100%;overflow:hidden;background:var(--win-bg,#0b1526)}
.pv-cine{position:absolute;inset:0;display:grid;grid-template-columns:minmax(300px,40%) 1fr}
@media(max-width:680px){.pv-cine{grid-template-columns:1fr;grid-template-rows:44% 1fr}}
/* colonne texte — toujours lisible */

display:flex;flex-direction:column;justify-content:flex-start;gap:13px;padding:30px 30px 26px;overflow-y:auto;
border-right:1px solid var(--line)}

.pv-title{font-size:1.55rem;font-weight:800;letter-spacing:-.02em;line-height:1.08;color:var(--ink);text-wrap:balance;margin-top:-2px}
@media(max-width:680px){.pv-title{font-size:1.3rem}}

.pv-fact-v{font-size:.78rem;font-weight:600;margin-top:2px;color:var(--ink)}

/* colonne image — dans son propre espace */
.pv-cine-bg{position:relative;background-size:cover;background-position:center;background-color:#0a0f1e;cursor:zoom-in;overflow:hidden}
.pv-cine.light .pv-cine-bg{background-size:contain;background-repeat:no-repeat;background-color:#eef1f6}
.pv-noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3rem;opacity:.3}

.pv-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:40px;height:40px;border-radius:50%;

display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);transition:background .15s,transform .15s}
.pv-nav:hover{background:rgba(41,184,217,.85);transform:translateY(-50%) scale(1.08)}
.pv-nav-l{left:12px}.pv-nav-r{right:12px}
/* pellicule images — bas de l'image */
.pv-film{position:absolute;bottom:12px;left:12px;right:12px;z-index:4;display:flex;gap:7px;overflow-x:auto;padding:2px;justify-content:center}
.pv-film::-webkit-scrollbar{height:0}
.pv-thumb{flex:0 0 46px;height:46px;border-radius:7px;background-size:cover;background-position:center;background-color:#0a0f1e;cursor:pointer;
border:2px solid rgba(255,255,255,.4);opacity:.7;transition:opacity .15s,border-color .15s,transform .15s}
.pv-thumb:hover{opacity:1;transform:translateY(-2px)}
.pv-thumb.on{opacity:1;border-color:var(--cyan)}
/* compteur + grille — haut de l'image */
.pv-topbar{position:absolute;top:14px;right:14px;z-index:5;display:flex;gap:8px;align-items:center}
.pv-counter{font-size:.56rem;font-weight:700;letter-spacing:.08em;color:#fff;background:rgba(8,14,28,.55);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 11px;backdrop-filter:blur(8px)}
.pv-gridbtn{width:36px;height:36px;border-radius:10px;background:rgba(8,14,28,.55);border:1px solid rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(8px);transition:background .15s}
.pv-gridbtn:hover{background:rgba(41,184,217,.85)}
.pv-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:.6rem;color:var(--mid);text-align:center}

/* ══════════ Galerie magazine (B) — overlay ══════════ */
.pv-grid-ov{position:absolute;inset:0;z-index:20;background:rgba(6,11,22,.985);backdrop-filter:blur(16px);
display:flex;flex-direction:column;padding:20px 22px;animation:pvFade .2s ease both}
@keyframes pvFade{from{opacity:0}to{opacity:1}}
.pv-grid-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-shrink:0}
.pv-grid-h{font-size:1.05rem;font-weight:800;color:#fff}
.pv-grid-close{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:#fff;cursor:pointer;font-size:1rem}
.pv-grid-close:hover{background:rgba(255,95,87,.8)}
.pv-mag{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:100px;gap:10px;overflow-y:auto;padding:2px}
@media(max-width:640px){.pv-mag{grid-template-columns:repeat(2,1fr)}}
.pv-mag-card{border-radius:11px;overflow:hidden;position:relative;cursor:pointer;background:#0d1424 var(--mc,none);background-size:cover;background-position:center;border:1px solid var(--line)}
.pv-mag-card::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75),transparent 55%);transition:opacity .2s}
.pv-mag-card:hover{transform:translateY(-3px);border-color:var(--cyan)}
.pv-mag-card.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
.pv-mag-cap{position:absolute;left:0;bottom:0;z-index:2;padding:10px 12px}
.pv-mag-cap .t{font-size:.82rem;font-weight:700;color:#fff;line-height:1.15}
.pv-mag-cap .s{font-size:.6rem;color:rgba(255,255,255,.7);margin-top:2px}
/* tailles asymétriques */
.pv-mag-card:nth-child(6n+1){grid-column:span 2;grid-row:span 2}
.pv-mag-card:nth-child(6n+4){grid-row:span 2}
@media(max-width:640px){.pv-mag-card:nth-child(6n+1){grid-column:span 2;grid-row:span 1}.pv-mag-card:nth-child(6n+4){grid-row:span 1}}

/* ══════════ Étude de cas scrollable (C) ══════════ */
.pv-cs{position:absolute;inset:0;overflow-y:auto;background:var(--bg2,#0a1424)}
.pv-cs::-webkit-scrollbar{width:8px}.pv-cs::-webkit-scrollbar-thumb{background:var(--line2,rgba(255,255,255,.14));border-radius:8px}
.pv-cs-hero{height:44%;min-height:200px;position:relative;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:26px 32px}
.pv-cs-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(6,11,22,.92),transparent 60%)}
.pv-cs-hero-in{position:relative;z-index:2}
.pv-cs-eyebrow{font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);font-weight:800;margin-bottom:8px}
.pv-cs-title{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;line-height:1.02;color:#fff}
.pv-cs-metabar{display:flex;gap:26px;flex-wrap:wrap;padding:18px 32px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}
.pv-cs-metabar div{font-size:.62rem;color:var(--mid)}.pv-cs-metabar b{color:var(--ink);font-weight:600;display:block;font-size:.82rem;margin-top:2px}
.pv-cs-body{padding:26px 32px;display:flex;flex-direction:column;gap:22px}
.pv-cs-block{display:grid;grid-template-columns:130px 1fr;gap:20px;align-items:start}
@media(max-width:640px){.pv-cs-block{grid-template-columns:1fr;gap:5px}}
.pv-cs-bl-l{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:800;padding-top:2px}
.pv-cs-bl-p{font-size:.86rem;color:#c9d6e8;line-height:1.68}
.pv-cs-imgs{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 32px 30px}
.pv-cs-imgs .im{border-radius:10px;overflow:hidden;background:#0d1424;border:1px solid var(--line);cursor:zoom-in}
.pv-cs-imgs .im img{width:100%;display:block}
.pv-cs-imgs .im:first-child{grid-column:span 2}
.pv-cs-tags{display:flex;gap:6px;flex-wrap:wrap;padding:0 32px 8px}
.pv-cs-legal{font-size:.58rem;color:var(--mid);font-style:italic;padding:0 32px 26px;opacity:.8}

.gal-wrap{display:flex;flex-direction:column;height:100%}

.gal-grid{
flex:1;overflow-y:auto;

.gal-card{position:relative;aspect-ratio:4/3;cursor:pointer;overflow:hidden;background:#0d1120;border-radius:6px;border:1px solid rgba(255,255,255,.12)}

<script>
const GH_CONFIG_URL='/api/get-config';
const AAR_CFG_KEYS=['aar_portfolio','aar_desk','aar_sec_hero','aar_sec_contact','aar_sec_about','aar_cv','aar_theme','aar_sec_marquee','aar_i18n'];

(async function loadRemoteConfig(){
try{
const res=await fetch(GH_CONFIG_URL+'?_='+Date.now(),{cache:'no-store'});
if(!res.ok) return;
const cfg=await res.json();
let changed=false;
AAR_CFG_KEYS.forEach(k=>{
if(cfg[k]!==undefined && cfg[k]!==null){
const val=JSON.stringify(cfg[k]);
if(localStorage.getItem(k)!==val){ localStorage.setItem(k,val); changed=true; }
}
});
if(changed) renderDesktopFolders();
}catch(_){}
})();

(function migrateData(){
try {
['aar_sec_hero','aar_sec_contact'].forEach(k=>{
const d=JSON.parse(localStorage.getItem(k)||'null');
if(!d) return;
let changed=false;
['t2','copy'].forEach(f=>{
if(d[f] && /AAR\s*Design/i.test(d[f])){ d[f]=d[f].replace(/AAR\s*Design/gi,'Aardesign'); changed=true; }
});
if(changed) localStorage.setItem(k,JSON.stringify(d));
});
} catch(_){}
})();

(function applyTheme(){
try {
const t = JSON.parse(localStorage.getItem('aar_theme')||'null');
if (!t) return;
const r = document.documentElement.style;
if (t.navy)   r.setProperty('--navy', t.navy);
if (t.cyan)   r.setProperty('--cyan', t.cyan);
if (t.cyan2)  r.setProperty('--cyan2', t.cyan2);
if (t.lsbg1)  { r.setProperty('--wall-a', t.lsbg1); r.setProperty('--desk-a', t.lsbg1); }
if (t.lsbg2)  { r.setProperty('--wall-b', t.lsbg2); r.setProperty('--desk-b', t.lsbg2); }
if (t.deskbg1) r.setProperty('--desk-a', t.deskbg1);
if (t.deskbg2) r.setProperty('--desk-b', t.deskbg2);
if (t.wallpaper) r.setProperty('--desk-img', `url('${t.wallpaper}')`);
else r.setProperty('--desk-img', 'none');
if (t.win)    r.setProperty('--win-bg', t.win + 'f0');
if (t.txt)    { r.setProperty('--ink', t.txt); r.setProperty('--ink-l', t.txt); }
if (t.fontBody) r.setProperty('--font', `'${t.fontBody}', sans-serif`);
} catch(e) {}
})();

function lsClock(){
const n=new Date();
const hh=String(n.getHours()).padStart(2,'0');
const mm=String(n.getMinutes()).padStart(2,'0');
const time=hh+':'+mm;
document.getElementById('ls-time').textContent=time;

const winLayer=document.getElementById('win-layer');
let topZ=10;
const openWins={};

function bringFront(w){ w.style.zIndex=++topZ; }

function makeDraggable(win,bar){
let drag=false,ox,oy;
bar.addEventListener('pointerdown',e=>{
if(e.target.closest('.win-ctrls')) return;
drag=true; bringFront(win);
ox=e.clientX-win.offsetLeft; oy=e.clientY-win.offsetTop;
bar.setPointerCapture(e.pointerId);
});
bar.addEventListener('pointermove',e=>{
if(!drag) return;
const x=Math.max(0,Math.min(innerWidth-80,e.clientX-ox));
const y=Math.max(36,Math.min(innerHeight-50,e.clientY-oy));
win.style.left=x+'px'; win.style.top=y+'px';
});
bar.addEventListener('pointerup',()=>drag=false);
}

function makeResizable(win){
const h=win.querySelector('.win-resize'); if(!h) return;
let rs=false,sx,sy,sw,sh;
h.addEventListener('pointerdown',e=>{
e.stopPropagation(); rs=true;
sx=e.clientX; sy=e.clientY; sw=win.offsetWidth; sh=win.offsetHeight;
h.setPointerCapture(e.pointerId);
});
h.addEventListener('pointermove',e=>{
if(!rs) return;
win.style.width=Math.max(320,sw+(e.clientX-sx))+'px';
win.style.height=Math.max(200,sh+(e.clientY-sy))+'px';
});
h.addEventListener('pointerup',()=>rs=false);
}

function markTb(id,on,state){
document.querySelectorAll(`.tb-app-pill[data-win="${id}"]`).forEach(b=>{
  b.classList.toggle('open',!!on);
  b.dataset.winState=state||'open';
});
}

function taskbarAdd(id){
  const win=openWins[id]; if(!win) return;
  const tb=document.getElementById('dock-minimized'); if(!tb) return;
  if(tb.querySelector(`[data-tbwin="${id}"]`)) return;
  const titleEl=win.querySelector('.win-title');
  const iconEl=win.querySelector('.win-icon');
  const name=titleEl?titleEl.textContent.trim().replace(/\s+\d+\s+image.*/,'').trim():'';
  const iconHtml=iconEl?iconEl.innerHTML:'';
  const pill=document.createElement('div');
  pill.className='tb-win-pill';
  pill.dataset.tbwin=id;
  pill.innerHTML=`<div class="tb-pill-face"><div class="tb-pill-ico">${iconHtml}</div></div><span class="tb-pill-name">${name}</span>`;
  pill.addEventListener('click',()=>restoreWin(id));
  tb.appendChild(pill);
  tb.classList.add('has-items');
  document.getElementById('dock-sep').style.display='';
}

function taskbarRemove(id){
  const tb=document.getElementById('dock-minimized');
  const pill=tb?.querySelector(`[data-tbwin="${id}"]`);
  if(!pill) return;
  pill.style.animation='pillOut .15s ease both';
  setTimeout(()=>{
    pill.remove();
    if(!tb.querySelector('.tb-win-pill')){
      tb.classList.remove('has-items');
      document.getElementById('dock-sep').style.display='none';
    }
  },150);
}

function restoreWin(id){
  const win=openWins[id]; if(!win) return;
  taskbarRemove(id);
  if(win.style.display==='none'){
    win.style.display='';
    win.style.transition='transform .22s cubic-bezier(.34,1.56,.64,1),opacity .18s';
    win.style.transform='scale(.85)';win.style.opacity='0';
    requestAnimationFrame(()=>{ win.style.transform='scale(1)';win.style.opacity='1'; });
    setTimeout(()=>{ win.style.transition=''; bringFront(win); },220);
  } else { bringFront(win); }
}

function applyPortrait(){
const hero = JSON.parse(localStorage.getItem('aar_sec_hero')||'null');
const el=document.getElementById('desk-portrait'); if(!el) return;
const src=hero&&hero.bgPhoto;
if(src){
const gray=(hero.bgGray!==false)?1:0;
const bright=(hero.bgBright!=null)?hero.bgBright:1.1;
const contrast=(hero.bgContrast!=null)?hero.bgContrast:1.1;
const opacity=(hero.bgOpacity!=null)?hero.bgOpacity:.9;
const posY=(hero.bgPosY!=null)?hero.bgPosY:30;
const posX=(hero.bgPosX!=null)?hero.bgPosX:70;
const zoom=(hero.bgZoom!=null)?hero.bgZoom:100;
el.style.backgroundImage=`url('${src}')`;
el.style.filter=`grayscale(${gray}) contrast(${contrast}) brightness(${bright})`;
el.style.backgroundSize=`auto ${zoom}%`;
el.style.backgroundPosition=`${posX}% ${posY}%`;
requestAnimationFrame(()=>{ el.classList.add('on'); el.style.opacity=opacity; });
}
else{ el.classList.remove('on'); el.style.backgroundImage=''; el.style.opacity=''; }
}
applyIdentity();

// ── Analytics de session ──
const aarSession={
  start:Date.now(),
  actions:[],
  log(type,label){
    this.actions.push({type,label,t:Math.round((Date.now()-this.start)/1000)});
  },
  sent:false,
  sendSummary(){
    if(this.sent) return;
    if(!this.actions.length) return; // rien fait → pas de récap
    this.sent=true;
    const durationS=Math.round((Date.now()-this.start)/1000);
    const payload={
      type:'summary',
      duration:durationS,
      actions:this.actions,
      page:location.pathname||'/'
    };
    try{
      navigator.sendBeacon('/api/track-visit',new Blob([JSON.stringify(payload)],{type:'application/json'}));
    }catch(_){
      fetch('/api/track-visit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive:true}).catch(()=>{});
    }
  }
};
function aarLog(type,label){ try{ aarSession.log(type,label); }catch(_){} }

// Track visit — once per session (arrivée)
if(!sessionStorage.getItem('aar_tracked')){
sessionStorage.setItem('aar_tracked','1');
fetch('/api/track-visit',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({
page:location.pathname||'/',
referrer:document.referrer||'',
ua:navigator.userAgent
})
}).catch(()=>{});
}

// Clics importants (email, tél, réseaux, CV)
document.addEventListener('click',(e)=>{
  const a=e.target.closest('a,button'); if(!a) return;
  const href=a.getAttribute('href')||'';
  if(href.startsWith('mailto:')) aarLog('clic','📧 Email');
  else if(href.startsWith('tel:')) aarLog('clic','📞 Téléphone');
  else if(/instagram\.com/i.test(href)) aarLog('clic','📷 Instagram');
  else if(/behance\.net/i.test(href)) aarLog('clic','🎨 Behance');
  else if(/linkedin\.com/i.test(href)) aarLog('clic','💼 LinkedIn');
  else if(/\.pdf($|\?)/i.test(href)||/cv/i.test(a.textContent||'')&&/télécharg|download/i.test(a.textContent||'')) aarLog('clic','📄 CV téléchargé');
  else if(a.dataset&&a.dataset.copy){
    const v=a.dataset.copy;
    aarLog('clic',/@/.test(v)?'📋 Email copié':/^[\d +]/.test(v)?'📋 Tél copié':'📋 Copié');
  }
},true);

// Récap de session au départ

// ── Construit la liste de projets d'un dossier (avec migration depuis l'ancien format) ──
function pvProjectsFor(fid){
const portfolio=JSON.parse(localStorage.getItem('aar_portfolio')||'{}');
if(portfolio._projects&&portfolio._projects[fid]) return portfolio._projects[fid];
// migration à la volée : ancien tableau d'images → 1 projet
const legacy=(portfolio[fid]&&portfolio[fid].length)?portfolio[fid]:((typeof DEFAULT_PORTFOLIO!=='undefined'&&DEFAULT_PORTFOLIO[fid])||[]);
if(legacy&&legacy.length){
const meta=(portfolio._meta&&portfolio._meta[fid])||{};
return [{id:1,title:'',client:'',year:'',role:'',images:legacy.map(im=>({src:im.src,title:im.title||''})),context:'',objective:'',approach:'',result:'',tags:[],legalMention:meta.legalMention||''}];
}
return [];
}

const _pvData={};
const _esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// Blocs de récit communs (contexte/objectif/démarche/résultat)
function pvBlocks(p,pid){
return [
[t('ctx'),TR(pid+'.context',p.context)],[t('goal'),TR(pid+'.objective',p.objective)],[t('approach'),TR(pid+'.approach',p.approach)],[t('outcome'),TR(pid+'.result',p.result)]
].filter(b=>b[1]&&b[1].trim());
}
function pvClientOf(p,pid){ return TR(pid+'.client',p.client); }
function pvFactsArr(p,pid){
return [[t('client'),pvClientOf(p,pid)],[t('role'),TR(pid+'.role',p.role)],[t('year'),p.year]].filter(f=>f[1]&&f[1].trim());
}
function pvTagArr(p,pid){ return (TR(pid+'.tags',(p.tags||[]).join(', '))||'').split(',').map(x=>x.trim()).filter(Boolean); }
function pvTitleOf(p,pid){ return TR(pid+'.title',p.title)||(aarLang()==='en'?'Untitled':'Sans titre'); }

function pvRender(fid){
const st=_pvData[fid]; if(!st) return;
const wrap=document.getElementById('pv-wrap-'+fid); if(!wrap) return;
if(!st.projects.length){
wrap.innerHTML=`<div class="pv-empty"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" width="42" height="42"><rect x="4" y="10" width="40" height="28" rx="3"/><circle cx="18" cy="22" r="4"/><path d="m4 32 12-10 8 8 6-5 14 13"/></svg><p>${t('noproj')}</p><p style="font-size:.65rem;opacity:.6">Admin → Portfolio OS</p></div>`;
return;
}
const p=st.projects[st.p]||st.projects[0];
if(fid==='sites') return pvRenderCS(fid,wrap,p);
pvRenderCine(fid,wrap,p);
}

// ── Vue cinématique (A) ──
function pvRenderCine(fid,wrap,p){
const st=_pvData[fid];const projects=st.projects;
const pid='proj.'+p.id;
const imgs=p.images||[];
const cover=imgs[st.i]||imgs[0]||{src:''};
const multi=projects.length>1;
const light=(p.light!==undefined)?p.light:(fid==='logo');
const eyebrow=[pvClientOf(p,pid),p.year].filter(Boolean).join(' · ')||st.folder;
const facts=pvFactsArr(p,pid).map(f=>`<div><div class="pv-fact-l">${f[0]}</div><div class="pv-fact-v">${_esc(f[1])}</div></div>`).join('');

function pvCsLightbox(fid,idx){ const st=_pvData[fid]; if(!st) return; const p=st.projects[st.p]; if(p&&p.images) openLightbox(p.images,idx,false); }

function pvProj(fid,dir){
const st=_pvData[fid]; if(!st) return;
const n=st.projects.length;
st.p=(st.p+dir+n)%n; st.i=0; st.gridOpen=false;

function pvImg(fid,idx){ const st=_pvData[fid]; if(!st) return; st.i=idx; pvRender(fid); }
function pvLightbox(fid){
const st=_pvData[fid]; if(!st) return;
const p=st.projects[st.p]; if(!p||!p.images||!p.images.length) return;
openLightbox(p.images,st.i,false);

function openLightbox(imgs,startIdx,isLogo=false){
let idx=startIdx;
try{const im=imgs[startIdx]; aarLog('image',(im&&(im.title||im.src.split('/').pop()))||'image');}catch(_){}
document.getElementById('w-lightbox')?.remove();
const lb=document.createElement('div');
lb.id='w-lightbox';
const imgWrapStyle=isLogo?'padding:20px;':'';
const imgStyle=isLogo?'object-fit:contain;max-height:75vh;max-width:85vw;':'';

lb.innerHTML=`<div class="lb-bg" style="${isLogo?'background:#f0f0f0;backdrop-filter:none':''}"></div>
<button class="lb-close" style="${isLogo?'background:rgba(0,0,0,.15);color:#333':''}" onclick="document.getElementById('w-lightbox').remove()">✕</button>
<button class="lb-nav lb-prev" style="${isLogo?'background:rgba(0,0,0,.15);color:#333':''}" id="lb-prev">‹</button>
<div class="lb-img-wrap" style="${imgWrapStyle}">
<img id="lb-img" src="${imgs[idx].src}" alt="" style="${imgStyle}">
<div class="lb-caption" id="lb-cap">${imgs[idx].title||''}</div>
</div>
<button class="lb-nav lb-next" style="${isLogo?'background:rgba(0,0,0,.15);color:#333':''}" id="lb-next">›</button>
<div class="lb-counter" style="${isLogo?'color:rgba(0,0,0,.4)':''}" id="lb-ctr">${idx+1} / ${imgs.length}</div>`;
document.body.appendChild(lb);
lb.querySelector('.lb-bg').addEventListener('click',()=>lb.remove());
function go(n){ idx=(n+imgs.length)%imgs.length; lb.querySelector('#lb-img').src=imgs[idx].src; lb.querySelector('#lb-cap').textContent=imgs[idx].title||''; lb.querySelector('#lb-ctr').textContent=(idx+1)+' / '+imgs.length; }
lb.querySelector('#lb-prev').addEventListener('click',()=>go(idx-1));
lb.querySelector('#lb-next').addEventListener('click',()=>go(idx+1));
document.addEventListener('keydown',function kh(e){
if(e.key==='Escape'){lb.remove();document.removeEventListener('keydown',kh);}
else if(e.key==='ArrowLeft') go(idx-1);
else if(e.key==='ArrowRight') go(idx+1);
});
if(imgs.length<=1){ lb.querySelector('#lb-prev').style.display='none'; lb.querySelector('#lb-next').style.display='none'; }
}

// ══════════ i18n (FR / EN) — langue déterminée par l'URL (/en) ══════════
function aarLang(){ return /^\/en(\/|$)/i.test(location.pathname) ? 'en' : 'fr'; }
// Traductions de contenu (généré via admin) : { en: { "chemin": "texte" } }
function aarI18n(){ try{ return JSON.parse(localStorage.getItem('aar_i18n')||'{}'); }catch(_){ return {}; } }
// TR(chemin, texteFR) → renvoie l'EN si dispo et langue=en, sinon le FR
function TR(path, fr){
  if(aarLang()!=='en') return fr;
  const dict=(aarI18n().en)||{};
  const v=dict[path];
  return (v!==undefined && v!==null && v!=='') ? v : fr;
}

function t(k){ return (UI_STR[aarLang()]||UI_STR.fr)[k] || (UI_STR.fr[k]||k); }
// Applique les libellés statiques du DOM (dock, bouton thème, langue)
function applyStaticLang(){
  const set=(id,val)=>{ const e=document.querySelector(id); if(e) e.textContent=val; };

  const keys=['cv','contact','message','about'];
  dock.forEach((el,i)=>{ if(keys[i]) el.textContent=t(keys[i]); });
  const lb=document.getElementById('lang-float-lbl'); if(lb) lb.textContent=aarLang()==='en'?'FR':'EN';
  document.documentElement.lang=aarLang();
}

function getDeskData(){
try{ return JSON.parse(localStorage.getItem('aar_desk')||'null')||DEFAULT_DESK_DATA; }
catch(_){ return DEFAULT_DESK_DATA; }
}

function deskFolderSvg(ico){
return DESK_ICONS[ico]||DESK_ICONS.grid;
}

function deskFolderAction(action){
if(!action) return '';
const [type,id]=action.split(':');
if(type==='category') return `openCategory('${id}')`;
return `openFolder('${id}')`;
}

function renderDesktopFolders(){
const data=getDeskData();
const container=document.getElementById('desk-dynamic-folders');
if(!container) return;
const bySection={};
data.sections.forEach(s=>{ bySection[s]=[]; });
data.folders.forEach(f=>{
if(f.inPro) return;
if(!bySection[f.section]) bySection[f.section]=[];
bySection[f.section].push(f);
});
let _fn=0;
container.innerHTML=data.sections.map(sec=>{
const folders=bySection[sec]||[];
if(!folders.length) return '';
return `<div class="desk-section">
<div class="desk-section-label">${TR('section.'+sec,sec)}</div>
<div class="desk-folder-list">
${folders.map(f=>`<div class="dfl-row" onclick="${deskFolderAction(f.action)}">
<span class="dfl-label">${TR('folder.'+f.id,f.label)}</span>
<span class="dfl-arrow">→</span>
</div>`).join('')}
</div>
</div>`;
}).join('');
}
