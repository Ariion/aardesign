<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aardesign — Anthony Armand</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   TOKENS
═══════════════════════════════════════ */
:root{
  --navy:#1B3560; --cyan:#29B8D9; --cyan2:#0097BA;
  --tb:64px;
  --theme-transition:.35s cubic-bezier(.4,0,.2,1);

  /* ── DARK (default) ── */
  --wall-a:#050b18; --wall-b:#071228;
  --desk-a:#050b18; --desk-b:#071228;
  --desk-img:none;
  --bar-bg:rgba(6,11,24,.82);
  --bar-border:rgba(41,184,217,.13);
  --ink:#dde8f6; --mid:#5c7899; --line:rgba(255,255,255,.055);
  --win-bg:rgba(10,17,40,.88);
  --win-bar:rgba(7,12,30,.92);
  --win-border:rgba(41,184,217,.2);
  --win-shadow:0 24px 64px rgba(0,0,0,.55),0 0 0 1px rgba(41,184,217,.08);
  --icon-bg:rgba(41,184,217,.07); --icon-hover:rgba(41,184,217,.14);
  --folder-bg:rgba(27,53,96,.45); --folder-hover:rgba(27,53,96,.75);
  --skill-bg:rgba(41,184,217,.12); --skill-fill:linear-gradient(90deg,var(--cyan2),var(--cyan));
  --chip-bg:rgba(41,184,217,.09); --chip-c:var(--cyan);
  --scroll-thumb:rgba(41,184,217,.2);
}

/* ── LIGHT ── */
[data-theme="light"]{
  --wall-a:#eef2fa; --wall-b:#e0e9f8;
  --desk-a:#eef2fa; --desk-b:#e0e9f8;
  --bar-bg:rgba(255,255,255,.82);
  --bar-border:rgba(27,53,96,.1);
  --ink:#12254d; --mid:#6278a0; --line:rgba(27,53,96,.07);
  --win-bg:rgba(255,255,255,.96);
  --win-bar:rgba(245,248,255,.98);
  --win-border:rgba(27,53,96,.09);
  --win-shadow:0 16px 48px rgba(18,37,77,.12),0 2px 8px rgba(18,37,77,.06);
  --icon-bg:rgba(27,53,96,.06); --icon-hover:rgba(27,53,96,.11);
  --folder-bg:rgba(27,53,96,.06); --folder-hover:rgba(27,53,96,.12);
  --skill-bg:rgba(27,53,96,.07); --skill-fill:linear-gradient(90deg,var(--navy),var(--cyan2));
  --chip-bg:rgba(27,53,96,.07); --chip-c:var(--navy);
  --scroll-thumb:rgba(27,53,96,.18);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased}
html{transition:color-scheme var(--theme-transition)}
body{background:var(--wall-a);color:var(--ink);transition:background var(--theme-transition),color var(--theme-transition);user-select:none}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border-radius:4px}

/* ═══════════════════════════════════════
   WALLPAPER ANIMÉ
═══════════════════════════════════════ */
:root{ --wall-a:#060d1f; --wall-b:#040914; }
[data-theme="light"]{ --wall-a:#f0f4ff; --wall-b:#e4ecfb; }

#wall{
  position:fixed;inset:0;z-index:0;
  background:linear-gradient(160deg, var(--wall-a) 0%, var(--wall-b) 100%);
  transition:background var(--theme-transition);
  overflow:hidden;
}

/* Blobs animés */
.wb{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform,opacity;}

/* Blob 1 — grand cyan bas-gauche */
.wb1{width:80vw;height:70vh;left:-25vw;bottom:-20vh;
  background:radial-gradient(circle,rgba(0,151,186,.32) 0%,transparent 70%);
  animation:wb1 14s ease-in-out infinite;}
@keyframes wb1{
  0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(6vw,-8vh) scale(1.08);}
  66%{transform:translate(-4vw,5vh) scale(.95);}
}

/* Blob 2 — navy haut-droite */
.wb2{width:70vw;height:65vh;right:-20vw;top:-15vh;
  background:radial-gradient(circle,rgba(41,184,217,.18) 0%,transparent 70%);
  animation:wb2 18s ease-in-out infinite;}
@keyframes wb2{
  0%,100%{transform:translate(0,0) scale(1);}
  40%{transform:translate(-8vw,10vh) scale(1.06);}
  70%{transform:translate(4vw,-5vh) scale(.93);}
}

/* Blob 3 — navy centre profond */
.wb3{width:90vw;height:80vh;left:5vw;top:10vh;
  background:radial-gradient(circle,rgba(27,53,96,.55) 0%,transparent 65%);
  animation:wb3 22s ease-in-out infinite;}
@keyframes wb3{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(5vw,6vh) scale(1.04);}
}

/* Blob 4 — accent chaud discret */
.wb4{width:40vw;height:40vh;right:5vw;bottom:10vh;
  background:radial-gradient(circle,rgba(0,151,186,.1) 0%,transparent 70%);
  animation:wb4 16s ease-in-out infinite 3s;}
@keyframes wb4{
  0%,100%{transform:translate(0,0) scale(1);}
  45%{transform:translate(-6vw,-10vh) scale(1.12);}
}

/* Grain texture organique */
#wall::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px 180px;
  opacity:.022;
  mix-blend-mode:overlay;
}
[data-theme="light"] #wall::before{opacity:.04}

/* Particules lumineuses */
#wall::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
  background-image:
    radial-gradient(1.5px 1.5px at 8%  15%, rgba(41,184,217,.9)  0%,transparent 100%),
    radial-gradient(1px   1px   at 23% 72%, rgba(41,184,217,.6)  0%,transparent 100%),
    radial-gradient(1px   1px   at 46% 38%, rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(2px   2px   at 72% 18%, rgba(41,184,217,.8)  0%,transparent 100%),
    radial-gradient(1px   1px   at 91% 55%, rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 58% 83%, rgba(41,184,217,.55) 0%,transparent 100%),
    radial-gradient(1px   1px   at 35% 5%,  rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1px   1px   at 82% 90%, rgba(41,184,217,.45) 0%,transparent 100%),
    radial-gradient(1px   1px   at 15% 50%, rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(2px   2px   at 50% 25%, rgba(41,184,217,.5)  0%,transparent 100%);
  animation:starTwinkle 8s ease-in-out infinite;
  opacity:1;transition:opacity .4s;
}
@keyframes starTwinkle{
  0%,100%{opacity:1;} 50%{opacity:.6;}
}
[data-theme="light"] #wall::after{opacity:0}

/* Cercle artistique signature */
#wall-art{
  position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;
}
#wall-art::before{
  content:'';position:absolute;
  width:min(900px,90vw);height:min(900px,90vw);
  top:-30%;right:-20%;
  border-radius:50%;
  border:1px solid rgba(41,184,217,.07);
  animation:circleBreath 20s ease-in-out infinite;
}
#wall-art::after{
  content:'';position:absolute;
  width:min(600px,65vw);height:min(600px,65vw);
  bottom:-20%;left:-15%;
  border-radius:50%;
  border:1px solid rgba(41,184,217,.05);
  animation:circleBreath 25s ease-in-out infinite reverse;
}
@keyframes circleBreath{
  0%,100%{transform:scale(1);opacity:.7;}
  50%{transform:scale(1.06);opacity:1;}
}
[data-theme="light"] #wall-art{opacity:0}
#wall-diag{display:none}

/* ═══════════════════════════════════════
   LOCK SCREEN
═══════════════════════════════════════ */
#lockscreen{
  position:fixed;inset:0;z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--ls-bg);
  cursor:pointer;
  transition:transform .6s cubic-bezier(.4,0,.2,1),opacity .4s,background var(--theme-transition);
  will-change:transform;
}
:root{
  --ls-bg:
    radial-gradient(ellipse 90% 70% at 20% 88%, rgba(0,151,186,.28) 0%, transparent 55%),
    radial-gradient(ellipse 70% 60% at 80% 12%, rgba(27,53,96,.45) 0%, transparent 50%),
    linear-gradient(150deg,#030810 0%,#061020 55%,#030810 100%);
}
[data-theme="light"]{
  --ls-bg:
    radial-gradient(ellipse 80% 60% at 15% 90%, rgba(41,184,217,.18) 0%, transparent 55%),
    radial-gradient(ellipse 60% 50% at 85% 10%, rgba(27,53,96,.1) 0%, transparent 50%),
    linear-gradient(150deg,#e8eef8 0%,#dde8f6 55%,#e4ecf8 100%);
}
#lockscreen.unlocking{transform:translateY(-100%);opacity:.7}
#ls-logo{margin-bottom:2.5rem;opacity:.75;transition:opacity var(--theme-transition)}
#ls-time{
  font-size:clamp(4rem,12vw,7rem);font-weight:300;letter-spacing:-.03em;
  color:var(--ls-ink,#fff);line-height:1;margin-bottom:.4rem;
  text-shadow:var(--ls-time-shadow,0 0 60px rgba(41,184,217,.3));
  transition:color var(--theme-transition);
}
#ls-date{font-size:.9rem;font-weight:400;color:var(--ls-mid,rgba(255,255,255,.5));letter-spacing:.04em;margin-bottom:2.5rem;transition:color var(--theme-transition)}
#ls-name{font-size:1rem;font-weight:700;letter-spacing:.12em;color:var(--ls-ink,rgba(255,255,255,.9));text-transform:uppercase;transition:color var(--theme-transition)}
#ls-role{font-size:.72rem;font-weight:400;color:var(--ls-mid,rgba(255,255,255,.45));letter-spacing:.06em;margin-top:.3rem;transition:color var(--theme-transition)}
:root{--ls-ink:rgba(255,255,255,.95);--ls-mid:rgba(255,255,255,.45);--ls-time-shadow:0 0 60px rgba(41,184,217,.3);--ls-img-filter:brightness(0) invert(1)}
[data-theme="light"]{--ls-ink:#12254d;--ls-mid:#6278a0;--ls-time-shadow:0 2px 24px rgba(27,53,96,.12);--ls-img-filter:none}
#ls-logo img{filter:var(--ls-img-filter);transition:filter var(--theme-transition)}
#ls-hint{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  font-size:.65rem;letter-spacing:.1em;color:var(--ls-mid);text-transform:uppercase;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:color var(--theme-transition);
}
#ls-hint::before{
  content:'';width:1px;height:24px;background:linear-gradient(transparent,rgba(41,184,217,.5));
  animation:pulseup 2s ease-in-out infinite;
}
@keyframes pulseup{0%,100%{opacity:.3;transform:scaleY(.7)}50%{opacity:1;transform:scaleY(1)}}
@keyframes winopen{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@keyframes winclose{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.94) translateY(6px)}}

/* ═══════════════════════════════════════
   TOP BAR
═══════════════════════════════════════ */
#topbar{
  position:fixed;top:0;left:0;right:0;height:64px;z-index:100;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px;
  background:var(--bar-bg);
  border-bottom:1px solid var(--bar-border);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  transition:background var(--theme-transition),border-color var(--theme-transition);
}
/* hamburger */
#tb-burger{
  display:flex;align-items:center;justify-content:flex-start;
  width:44px;height:44px;border-radius:8px;border:none;cursor:pointer;
  background:none;color:var(--mid);flex-direction:column;gap:4px;padding:8px 7px;
  transition:background .15s,color .15s;
}
#tb-burger:hover{background:var(--icon-hover);color:var(--ink)}
#tb-burger span{display:block;width:100%;height:2px;background:currentColor;border-radius:2px;transition:all .2s}
/* logo centré */
#tb-logo-center{
  display:flex;align-items:center;justify-content:center;
}
#tb-logo-center img{height:46px;width:auto;max-width:340px;opacity:.92;filter:brightness(0) invert(1)}
[data-theme="light"] #tb-logo-center img{filter:none;opacity:.95}
/* droite */
#tb-right{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.tb-ico-btn{
  width:32px;height:32px;border-radius:6px;border:none;cursor:pointer;
  background:none;color:var(--mid);display:flex;align-items:center;justify-content:center;
  font-size:.85rem;transition:background .15s,color .15s;
}
.tb-ico-btn:hover{background:var(--icon-hover);color:var(--ink)}
#tb-clock{font-size:.65rem;font-weight:600;color:var(--mid);letter-spacing:.04em;white-space:nowrap}
/* drawer menu */
#tb-drawer{
  position:fixed;top:64px;left:0;bottom:0;width:240px;z-index:200;
  background:var(--win-bg);border-right:1px solid var(--win-border);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  display:flex;flex-direction:column;padding:8px;gap:2px;
  transform:translateX(-100%);
  transition:transform .28s cubic-bezier(.4,0,.2,1),background var(--theme-transition),border-color var(--theme-transition);
  box-shadow:var(--win-shadow);
}
#tb-drawer.open{transform:translateX(0)}
#tb-drawer-overlay{
  position:fixed;inset:64px 0 0 0;z-index:199;
  display:none;
}
#tb-drawer.open ~ #tb-drawer-overlay{display:block}
.tm-item{
  display:flex;align-items:center;gap:.7rem;padding:10px 12px;
  border-radius:8px;cursor:pointer;font-size:.78rem;color:var(--ink);font-weight:500;
  transition:background .1s;border:none;background:none;font-family:inherit;width:100%;text-align:left;
}
.tm-item:hover{background:var(--icon-hover)}
.tm-item svg{opacity:.65;flex-shrink:0}
.tm-sep{height:1px;background:var(--line);margin:4px 0}
.tm-label{font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mid);padding:8px 12px 2px;font-weight:700;opacity:.6}
/* mobile home button */
/* Floating theme toggle — bottom center */
#theme-float{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9990;
  display:none;align-items:center;gap:6px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:var(--mid);padding:7px 14px;border-radius:30px;
  font:.6rem 'Montserrat',sans-serif;font-weight:600;letter-spacing:.06em;
  cursor:pointer;border:none;opacity:.5;
  transition:opacity .2s,background .2s;
}
#theme-float:hover{opacity:1;background:rgba(255,255,255,.12)}
[data-theme="light"] #theme-float{
  background:rgba(27,53,96,.06);border:1px solid rgba(27,53,96,.12);color:var(--mid);
}
#mob-home{
  display:none;
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:9998;
  background:rgba(41,184,217,.18);border:1px solid rgba(41,184,217,.35);
  backdrop-filter:blur(20px);color:var(--cyan);
  padding:10px 28px;border-radius:30px;font-size:.7rem;font-weight:700;
  letter-spacing:.06em;cursor:pointer;border:none;font-family:'Montserrat',sans-serif;
  gap:8px;align-items:center;
  box-shadow:0 4px 20px rgba(0,0,0,.3);
  transition:opacity .2s;
}

/* ═══════════════════════════════════════
   DESKTOP
═══════════════════════════════════════ */
#desktop{
  position:fixed;inset:64px 0 0 0;z-index:1;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}

/* Centered island */
#desk-center{
  display:flex;flex-direction:column;align-items:center;gap:0;
  pointer-events:all;
  padding:20px;
}

/* Quick-access app icons row */
#desk-apps{
  display:flex;flex-direction:row;gap:8px;margin-bottom:28px;
}
.d-icon{
  width:80px;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:12px 6px;border-radius:14px;cursor:pointer;
  background:var(--icon-bg);border:1px solid transparent;
  transition:background var(--theme-transition),border-color .15s,transform .15s;
}
.d-icon:hover{background:var(--icon-hover);border-color:var(--bar-border);transform:translateY(-3px)}
.d-icon:active{transform:scale(.95)}
.d-icon-face{
  width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.25);
}
.d-icon-label{font-size:.66rem;font-weight:600;color:var(--ink);text-align:center;line-height:1.2;letter-spacing:.01em}

/* Folder rows */
.desk-section{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:10px;width:100%}
.desk-section-label{
  font-size:.46rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:var(--cyan);opacity:.55;margin-bottom:2px;
}
.desk-section-label.sec-perso{color:var(--mid)}
.desk-folders-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.d-folder{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  width:88px;cursor:pointer;padding:10px 4px;border-radius:12px;
  border:1px solid transparent;transition:background .15s,border-color .15s,transform .15s;
}
.d-folder:hover{background:var(--folder-hover);border-color:var(--bar-border);transform:translateY(-3px)}
.d-folder:active{transform:scale(.95)}
.d-folder-ico{width:58px;height:48px;display:flex;align-items:center;justify-content:center}
.d-folder-label{font-size:.57rem;font-weight:600;color:var(--ink);text-align:center;line-height:1.3}

/* Category sub-folder grid inside windows */
.cat-grid{display:flex;flex-wrap:wrap;gap:8px;padding:14px;align-content:flex-start}
.cat-item{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  width:80px;cursor:pointer;padding:8px 4px;border-radius:10px;
  border:1px solid transparent;transition:background .15s,border-color .15s,transform .15s;
}
.cat-item:hover{background:var(--folder-hover);border-color:var(--bar-border);transform:translateY(-2px)}
.cat-item-ico{width:54px;height:44px;display:flex;align-items:center;justify-content:center}
.cat-item-lbl{font-size:.55rem;font-weight:600;color:var(--ink);text-align:center;line-height:1.3}

/* Identity hint */
#desk-identity{
  text-align:center;margin-bottom:18px;pointer-events:none;
}
#desk-identity div:first-child{font-size:.62rem;font-weight:800;letter-spacing:.12em;color:rgba(41,184,217,.8);text-transform:uppercase}
#desk-identity div:last-child{font-size:.54rem;color:var(--mid);margin-top:3px;letter-spacing:.04em}
.d-icon:active{transform:scale(.95)}
.d-icon-face{
  width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.d-icon-label{font-size:.62rem;font-weight:600;color:var(--ink);text-align:center;line-height:1.2;letter-spacing:.01em}

.d-folder{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  width:80px;cursor:pointer;padding:8px 4px;border-radius:10px;
  border:1px solid transparent;transition:background .15s,border-color .15s,transform .15s;
}
.d-folder:hover{background:var(--folder-hover);border-color:var(--bar-border);transform:translateY(-3px)}
.d-folder:active{transform:scale(.95)}
.d-folder-ico{width:54px;height:46px;display:flex;align-items:center;justify-content:center}
.d-folder-label{font-size:.54rem;font-weight:600;color:var(--ink);text-align:center;line-height:1.3}

/* Identity hint */
#desk-identity{
  text-align:center;margin-bottom:18px;pointer-events:none;
}
#desk-identity div:first-child{font-size:.62rem;font-weight:800;letter-spacing:.12em;color:rgba(41,184,217,.8);text-transform:uppercase}
#desk-identity div:last-child{font-size:.54rem;color:var(--mid);margin-top:3px;letter-spacing:.04em}

/* ═══════════════════════════════════════
   WINDOWS
═══════════════════════════════════════ */
#win-layer{position:fixed;inset:36px 0 0 0;z-index:50;pointer-events:none}
.win{
  position:absolute;display:flex;flex-direction:column;pointer-events:all;
  background:var(--win-bg);border:1px solid var(--win-border);border-radius:12px;
  box-shadow:var(--win-shadow);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  transition:background var(--theme-transition),border-color var(--theme-transition),box-shadow var(--theme-transition);
  backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  overflow:hidden;min-width:320px;min-height:200px;
  animation:winopen .2s cubic-bezier(.34,1.2,.64,1) both;
  transition:background var(--theme-transition),border-color var(--theme-transition);
}
/* ── MOBILE: fenêtres = modals plein écran ── */
@media(max-width:768px){
  #theme-float{display:none!important}
  .win{
    position:fixed!important;
    inset:64px 0 0 0!important;
    width:100%!important;height:calc(100% - 64px)!important;
    border-radius:0;min-width:0;min-height:0;
    transform:none!important;
    z-index:9999!important;
  }
  .win-bar{height:52px;padding:0 14px;}
  .win-ctrls{display:none}
  .win-btn.close-mobile{
    display:flex!important;
    width:36px;height:36px;border-radius:50%;border:none;
    background:rgba(255,255,255,.12);cursor:pointer;
    align-items:center;justify-content:center;
    margin-left:auto;
  }
  .win-btn.close-mobile svg{opacity:1;width:14px;height:14px;color:rgba(255,255,255,.85)}
  .win-resize{display:none}
  .win-body{-webkit-overflow-scrolling:touch}
  /* mob-home : affiché uniquement quand fenêtre ouverte, jamais sur lockscreen */
  #mob-home{display:none;bottom:10px;padding:9px 22px;font-size:.65rem}
  #desk-apps{display:flex;gap:4px}
  .d-icon{width:68px;padding:8px 4px}
  .d-icon-face{width:48px;height:48px;border-radius:12px}
  .d-folder{width:72px;padding:6px 2px}
  .d-folder-ico{width:46px;height:38px}
  .d-folder-label{font-size:.52rem}
  #desk-center{padding:12px 8px;gap:0}

  /* CV mobile : colonne unique + place pour bouton retour */
  .cv-wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:hidden}
  .cv-sidebar{
    border-radius:0;overflow-y:visible;min-height:0;
    padding:14px 16px 10px;
    display:grid;
    grid-template-columns:80px 1fr;
    grid-template-rows:auto;
    gap:0 12px;
    align-items:start;
  }
  .cv-avatar{width:64px;height:64px;margin-bottom:0;grid-row:1/3}
  .cv-s-name{font-size:.78rem;text-align:left;grid-column:2}
  .cv-s-role{text-align:left;grid-column:2;margin-top:2px}
  .cv-s-divider{display:none}
  .cv-s-contact{grid-column:1/-1;margin-top:8px;margin-bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}
  .cv-s-section{grid-column:1/-1;margin-top:6px;margin-bottom:2px}
  .cv-s-skill{grid-column:1/-1}
  .cv-skills-grid{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
  .cv-pdf-btn{display:none}
  .win-body:has(.cv-wrap){height:calc(100% - 52px)}
  .cv-main{padding:12px 14px 64px;gap:12px}
  #desk-apps{margin-bottom:18px}
  .desk-section{margin-bottom:6px}
  #id-badge{font-size:.55rem;bottom:8px;left:8px}
}
.win-bar{
  display:flex;align-items:center;gap:8px;padding:0 10px;height:38px;
  background:var(--win-bar);border-bottom:1px solid var(--line);flex-shrink:0;
  border-radius:12px 12px 0 0;cursor:default;
  transition:background var(--theme-transition),border-color var(--theme-transition);
}
.win-icon{width:16px;height:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.win-title{font-size:.7rem;font-weight:600;color:var(--ink);flex:1;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-ctrls{display:flex;gap:5px}
.win-btn{
  width:12px;height:12px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:filter .15s;
}
.win-btn.close{background:#ff5f57}
.win-btn.min{background:#febc2e}
.win-btn.max{background:#28c840}
.win-btn svg{opacity:0;width:8px;height:8px;color:rgba(0,0,0,.5);transition:opacity .15s}
.win-bar:hover .win-btn svg{opacity:1}
.win-body{flex:1;overflow:auto;padding:14px;font-size:.8rem;color:var(--ink);position:relative;transition:color var(--theme-transition),background var(--theme-transition)}
.win-resize{position:absolute;bottom:0;right:0;width:18px;height:18px;cursor:se-resize;z-index:2}
.win-resize::after{content:'';position:absolute;bottom:4px;right:4px;width:6px;height:6px;border-right:2px solid var(--mid);border-bottom:2px solid var(--mid);opacity:.4;border-radius:1px}
.w-toast{position:absolute;bottom:8px;right:8px;background:var(--cyan);color:#fff;font-size:.62rem;font-weight:600;padding:4px 10px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;letter-spacing:.04em}
.w-toast.show{opacity:1}

/* ── CV ── */
.cv-wrap{display:grid;grid-template-columns:200px 1fr;height:100%;gap:0;overflow:hidden}
.cv-sidebar{
  background:linear-gradient(170deg,var(--navy) 0%,rgba(27,53,96,.85) 100%);
  padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;
  border-radius:0 0 0 10px;overflow-y:auto;min-height:0;
}
[data-theme="light"] .cv-sidebar{background:linear-gradient(170deg,#1B3560 0%,#244a8c 100%)}
.cv-main{padding:20px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;height:100%}
.cv-avatar{width:80px;height:80px;border-radius:50%;overflow:hidden;flex-shrink:0;border:3px solid rgba(41,184,217,.6);margin-bottom:10px}
.cv-avatar img{width:100%;height:100%;object-fit:cover;object-position:top center}
.cv-s-name{font-size:.88rem;font-weight:800;color:#fff;text-align:center;letter-spacing:-.01em;line-height:1.2}
.cv-s-role{font-size:.56rem;color:rgba(41,184,217,.8);text-align:center;margin-top:4px;letter-spacing:.04em;font-weight:600;text-transform:uppercase}
.cv-s-divider{width:32px;height:1px;background:rgba(255,255,255,.15);margin:12px auto}
.cv-s-contact{width:100%;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.cv-s-row{display:flex;align-items:center;gap:7px}
.cv-s-ico{font-size:.75rem;opacity:.7;flex-shrink:0;width:14px;text-align:center}
.cv-s-val{font-size:.58rem;color:rgba(255,255,255,.75);font-weight:500;line-height:1.3;word-break:break-all}
.cv-s-section{font-size:.44rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(41,184,217,.6);margin:10px 0 6px;width:100%;text-align:left}
.cv-s-skill{margin-bottom:7px;width:100%}
.cv-s-skill-name{font-size:.6rem;font-weight:600;color:rgba(255,255,255,.8);display:flex;justify-content:space-between;margin-bottom:3px}
.cv-s-skill-name span{color:rgba(41,184,217,.7);font-size:.55rem}
.cv-s-skill-bar{height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.cv-s-skill-fill{height:100%;background:linear-gradient(90deg,var(--cyan2),var(--cyan));border-radius:2px}
.cv-pdf-btn{
  margin-top:auto;padding-top:14px;width:100%;
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:rgba(41,184,217,.15);border:1px solid rgba(41,184,217,.3);
  color:rgba(255,255,255,.85);border-radius:8px;padding:9px 12px;
  font:.68rem 'Montserrat',sans-serif;font-weight:700;cursor:pointer;
  text-decoration:none;letter-spacing:.04em;
  transition:background .15s,border-color .15s;
}
.cv-pdf-btn:hover{background:rgba(41,184,217,.28);border-color:rgba(41,184,217,.5)}
.cv-pdf-btn svg{flex-shrink:0}
.cv-m-section{font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:8px}
.cv-tl-item{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.cv-tl-dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);flex-shrink:0;margin-top:3px;box-shadow:0 0 6px rgba(41,184,217,.4)}
.cv-tl-title{font-size:.7rem;font-weight:700;color:var(--ink);line-height:1.3}
.cv-tl-sub{font-size:.6rem;color:var(--cyan);margin-top:1px;font-weight:600}
.cv-tl-desc{font-size:.6rem;color:var(--mid);margin-top:2px;line-height:1.5}
.cv-langs{display:flex;gap:6px;flex-wrap:wrap}
.cv-lang-pill{background:var(--icon-bg);border:1px solid var(--line);border-radius:20px;padding:4px 12px;text-align:center}
.cv-lang-pill div:first-child{font-size:.68rem;font-weight:700;color:var(--ink)}
.cv-lang-pill div:last-child{font-size:.55rem;color:var(--mid)}
.win-body:has(.cv-wrap){padding:0;overflow:hidden;display:flex;flex-direction:column;height:calc(100% - 38px)}

/* ── CONTACT / PROFILE ── */
.w-profile{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.w-ava{width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--icon-bg);flex-shrink:0;border:2px solid var(--cyan)}
.w-ava img{width:100%;height:100%;object-fit:cover;object-position:top center}
.w-name{font-size:.95rem;font-weight:800;color:var(--ink)}
.w-role{font-size:.62rem;color:var(--mid);margin-top:2px}
.w-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.w-row:last-child{border:none}
.w-row-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--icon-bg)}
.w-row-ico svg{width:18px;height:18px}
.w-row-info{flex:1}
.w-row-lbl{font-size:.58rem;color:var(--mid);font-weight:500}
.w-row-val{font-size:.72rem;font-weight:600;color:var(--ink);margin-top:1px}
.w-row-acts{display:flex;gap:5px;flex-shrink:0}
.w-btn{font-size:.6rem;font-weight:600;padding:4px 10px;border-radius:5px;cursor:pointer;border:1px solid var(--line);background:var(--icon-bg);color:var(--ink);font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;transition:background .15s}
.w-btn:hover{background:var(--icon-hover)}
.w-btn.pri{background:var(--cyan);border-color:var(--cyan);color:#fff}
.w-btn.pri:hover{background:var(--cyan2);border-color:var(--cyan2)}

/* ── MAIL ── */
.w-field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.w-field label{font-size:.6rem;font-weight:700;color:var(--mid);letter-spacing:.04em;text-transform:uppercase}
.w-field input,.w-field textarea{background:var(--icon-bg);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-size:.75rem;padding:8px 10px;border-radius:6px;outline:none;transition:border-color .15s,background .4s}
.w-field input:focus,.w-field textarea:focus{border-color:var(--cyan)}
.w-field textarea{resize:vertical;min-height:80px}
.w-send{width:100%;padding:10px;border-radius:6px;border:none;background:var(--cyan);color:#fff;font:700 .78rem 'Montserrat',sans-serif;cursor:pointer;letter-spacing:.04em;transition:background .15s}
.w-send:hover{background:var(--cyan2)}

/* ── ABOUT stats ── */
.ab-stat{background:var(--icon-bg);border-radius:8px;padding:10px;text-align:center}
.ab-stat-n{font-size:1.1rem;font-weight:800;color:var(--cyan)}
.ab-stat-l{font-size:.6rem;color:var(--mid);margin-top:2px}
.ab-tag{background:var(--chip-bg);border-radius:4px;padding:3px 8px;font-size:.65rem;color:var(--ink)}

/* ═══════════════════════════════════════
   GALLERY + LIGHTBOX
═══════════════════════════════════════ */
.gal-wrap{display:flex;flex-direction:column;height:100%}
.gal-header{display:flex;align-items:center;gap:.5rem;padding:.5rem .8rem;border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap;gap:.4rem}
.gal-grid{
  flex:1;overflow-y:auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:4px;padding:4px;
  align-content:start;
}
@media(max-width:768px){
  .gal-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:3px;padding:3px}
}
.gal-card{position:relative;aspect-ratio:4/3;cursor:pointer;overflow:hidden;background:#0a0f1e;border-radius:4px}
.gal-card img{width:100%;height:100%;object-fit:cover;transition:transform .22s,filter .22s;display:block}
.gal-card:hover img{transform:scale(1.06);filter:brightness(1.1)}
.gal-title{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,.82));
  color:#fff;font-size:.58rem;padding:18px 7px 6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transition:opacity .18s;
}
.gal-card:hover .gal-title{opacity:1}
.gal-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--mid);gap:.6rem;text-align:center;font-size:.75rem;padding:2rem}

#w-lightbox{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center}
.lb-bg{position:absolute;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(10px)}
.lb-img-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;max-width:90vw;max-height:90vh}
#lb-img{max-width:100%;max-height:80vh;object-fit:contain;border-radius:4px;box-shadow:0 20px 80px rgba(0,0,0,.8)}
.lb-caption{color:rgba(255,255,255,.6);font-size:.75rem;margin-top:.6rem;text-align:center}
.lb-close{position:absolute;top:16px;right:20px;z-index:2;background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:background .15s}
.lb-close:hover{background:rgba(255,255,255,.2)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:rgba(255,255,255,.1);border:none;color:#fff;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:1.6rem;display:flex;align-items:center;justify-content:center;transition:background .15s}
.lb-nav:hover{background:rgba(255,255,255,.2)}
.lb-prev{left:16px}.lb-next{right:16px}
.lb-counter{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:2;color:rgba(255,255,255,.4);font-size:.7rem}

/* ═══════════════════════════════════════
   ADMIN OVERLAY
═══════════════════════════════════════ */
#win-admin-overlay{
  position:fixed;inset:0;z-index:900;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.7);backdrop-filter:blur(20px);
}
.admin-card{
  background:var(--win-bg);border:1px solid var(--win-border);border-radius:16px;
  padding:32px 28px;width:min(320px,90vw);text-align:center;
}
.admin-card-ico{font-size:2rem;margin-bottom:12px}
.admin-card h3{font-size:.9rem;font-weight:800;color:var(--ink);margin-bottom:4px}
.admin-card p{font-size:.68rem;color:var(--mid);margin-bottom:20px}
#admin-pwd{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  font-size:.82rem;background:var(--icon-bg);color:var(--ink);outline:none;
  margin-bottom:10px;font-family:inherit;transition:border-color .15s,background .4s;
}
#admin-pwd:focus{border-color:var(--cyan)}
#admin-err{color:#ff5f57;font-size:.65rem;margin-bottom:10px;display:none}
#admin-submit{
  width:100%;padding:11px;border-radius:8px;border:none;
  background:var(--cyan);color:#fff;font:700 .82rem 'Montserrat',sans-serif;cursor:pointer;transition:background .15s;
}
#admin-submit:hover{background:var(--cyan2)}
#admin-cancel{background:none;border:none;color:var(--mid);font:.75rem 'Montserrat',sans-serif;margin-top:12px;cursor:pointer}
</style>
</head>
<body>

<!-- WALLPAPER -->

  <div class="wb wb2"></div>
  <div class="wb wb3"></div>
  <div class="wb wb4"></div>
</div>

<!-- ══════════════════════════════════════════
     LOCK SCREEN
══════════════════════════════════════════ -->
<div id="wall-art"></div>
<div id="wall-diag"></div>
<div id="lockscreen">
  <div id="ls-logo"><img src="assets/Logo-Aardesign-Long.png" alt="aardesign" style="width:clamp(220px,36vw,480px)"></div>
  <div id="ls-time">00:00</div>
  <div id="ls-date">—</div>
  <div id="ls-name">Anthony Armand</div>

</div>

<!-- ══════════════════════════════════════════
     TOP BAR
══════════════════════════════════════════ -->
<div id="topbar">
  <!-- Hamburger gauche -->
  <button id="tb-burger" onclick="toggleDrawer()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <!-- Logo centré -->
  <div id="tb-logo-center">
    <img src="assets/Logo-Aardesign-Long.png" alt="aardesign">
  </div>

  <!-- Droite -->
  <div id="tb-right">
    <button class="tb-ico-btn" id="theme-btn" title="Basculer le thème" onclick="toggleTheme()" aria-label="Thème">
      <svg id="theme-ico-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg id="theme-ico-sun"  viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>

<!-- Drawer menu -->
<div id="tb-drawer">
  <div class="tm-label">Navigation</div>
  <button class="tm-item" onclick="openApp('cv');closeDrawer()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 7h6M9 11h6M9 15h4" stroke-linecap="round"/></svg>
    Mon CV
  </button>
  <button class="tm-item" onclick="openApp('contact');closeDrawer()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/></svg>

  </button>
  <button class="tm-item" onclick="openApp('mail');closeDrawer()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M22 16.9v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.9z"/></svg>
    Message
  </button>
  <button class="tm-item" onclick="openApp('about');closeDrawer()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>
    À propos
  </button>
  <div class="tm-sep"></div>
  <div class="tm-label">Système</div>
  <button class="tm-item" onclick="document.getElementById('win-admin-overlay').style.display='flex';closeDrawer()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    Archives
  </button>
</div>
<div id="tb-drawer-overlay" onclick="closeDrawer()"></div>

<!-- Bouton retour bureau (mobile, visible quand fenêtre ouverte) -->
<button id="mob-home" onclick="closeAllWins()">⌂ Bureau</button>

<!-- Floating theme toggle -->
<button id="theme-float" onclick="toggleTheme()" aria-label="Basculer le thème">
  <svg id="tf-moon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg id="tf-sun"  viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
  Mode clair
</button>

<!-- ══════════════════════════════════════════
     DESKTOP
══════════════════════════════════════════ -->
<div id="desktop">
  <div id="desk-center">

    <!-- Quick-access app icons -->

/* Charge la config depuis GitHub (non-bloquant) */
(async function loadRemoteConfig(){
  try{
    const res=await fetch(GH_CONFIG_URL+'?_='+Date.now(),{cache:'no-store'});
    if(!res.ok) return;
    const cfg=await res.json();
    let changed=false;
    AAR_CFG_KEYS.forEach(k=>{
      if(cfg[k]!==undefined && cfg[k]!==null){
        const val=JSON.stringify(cfg[k]);
        if(localStorage.getItem(k)!==val){ localStorage.setItem(k,val); changed=true; }
      }
    });
    if(changed) renderDesktopFolders();
  }catch(_){}
})();

/* Fix legacy localStorage values */

})();

const winLayer=document.getElementById('win-layer');
let topZ=10;
const openWins={};

function bringFront(w){ w.style.zIndex=++topZ; }

function makeDraggable(win,bar){
  let drag=false,ox,oy;
  bar.addEventListener('pointerdown',e=>{
    if(e.target.closest('.win-ctrls')) return;
    drag=true; bringFront(win);
    ox=e.clientX-win.offsetLeft; oy=e.clientY-win.offsetTop;
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove',e=>{
    if(!drag) return;
    const x=Math.max(0,Math.min(innerWidth-80,e.clientX-ox));
    const y=Math.max(36,Math.min(innerHeight-50,e.clientY-oy));
    win.style.left=x+'px'; win.style.top=y+'px';
  });
  bar.addEventListener('pointerup',()=>drag=false);
}

function makeResizable(win){
  const h=win.querySelector('.win-resize'); if(!h) return;
  let rs=false,sx,sy,sw,sh;
  h.addEventListener('pointerdown',e=>{
    e.stopPropagation(); rs=true;
    sx=e.clientX; sy=e.clientY; sw=win.offsetWidth; sh=win.offsetHeight;
    h.setPointerCapture(e.pointerId);
  });
  h.addEventListener('pointermove',e=>{
    if(!rs) return;
    win.style.width=Math.max(320,sw+(e.clientX-sx))+'px';
    win.style.height=Math.max(200,sh+(e.clientY-sy))+'px';
  });
  h.addEventListener('pointerup',()=>rs=false);
}

function createWin(id,title,iconSvg,bodyHtml,w=440,h=480){
  if(openWins[id]){ bringFront(openWins[id]); return; }
  const win=document.createElement('div');
  win.className='win';
  win.style.width=w+'px'; win.style.height=h+'px';
  const n=Object.keys(openWins).length;
  win.style.left=Math.max(10,Math.min(innerWidth-w-20,80+n*30))+'px';
  win.style.top=Math.max(42,Math.min(innerHeight-h-20,50+n*28))+'px';
  win.style.zIndex=++topZ;
  win.innerHTML=`
    <div class="win-bar">
      <div class="win-icon">${iconSvg}</div>
      <span class="win-title">${title}</span>
      <div class="win-ctrls">
        <button class="win-btn min" title="Réduire"><svg viewBox="0 0 10 10"><line x1="1" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <button class="win-btn max" title="Agrandir"><svg viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/></svg></button>
        <button class="win-btn close" title="Fermer"><svg viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.5"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.5"/></svg></button>
      </div>
      <button class="win-btn close-mobile" style="display:none" title="Fermer"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/></svg></button>
    </div>
    <div class="win-body">${bodyHtml}<div class="w-toast">Copié !</div></div>
    <div class="win-resize"></div>`;
  winLayer.appendChild(win);
  openWins[id]=win;
  if(window.innerWidth<=768 && document.getElementById('lockscreen').style.display==='none') document.getElementById('mob-home').style.display='flex';
  win.addEventListener('pointerdown',()=>bringFront(win));
  makeDraggable(win,win.querySelector('.win-bar'));
  makeResizable(win);
  let maxed=false;
  win.querySelector('.win-btn.max').addEventListener('click',()=>{
    if(!maxed){
      win._sw=win.style.width;win._sh=win.style.height;win._sl=win.style.left;win._st=win.style.top;
      win.style.left='0';win.style.top='36px';win.style.width='100%';win.style.height='calc(100vh - 36px)';
      maxed=true;
    } else {
      win.style.width=win._sw;win.style.height=win._sh;win.style.left=win._sl;win.style.top=win._st;
      maxed=false;
    }
  });
  const closeFn=()=>{
    win.style.animation='winclose .15s ease both';
    setTimeout(()=>{ win.remove(); delete openWins[id]; markTb(id,false); if(Object.keys(openWins).length===0) document.getElementById('mob-home').style.display='none'; },150);
  };
  win.querySelector('.win-btn.close').addEventListener('click',closeFn);
  win.querySelector('.win-btn.close-mobile').addEventListener('click',closeFn);
  win.querySelector('.win-btn.min').addEventListener('click',()=>{ win.style.display='none'; markTb(id,false); });
  win.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{
    try{ await navigator.clipboard.writeText(b.dataset.copy); }catch(_){}
    const t=win.querySelector('.w-toast');
    if(t){ t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1400); }
  }));
  markTb(id,true);
}

function markTb(id,on){
  document.querySelectorAll(`.tb-app-pill[data-win="${id}"]`).forEach(b=>b.classList.toggle('open',on));
}

/* ── Lightbox ── */
function openLightbox(imgs,startIdx){
  let idx=startIdx;
  document.getElementById('w-lightbox')?.remove();
  const lb=document.createElement('div');
  lb.id='w-lightbox';
  lb.innerHTML=`<div class="lb-bg"></div>
    <button class="lb-close" onclick="document.getElementById('w-lightbox').remove()">✕</button>
    <button class="lb-nav lb-prev" id="lb-prev">‹</button>
    <div class="lb-img-wrap">
      <img id="lb-img" src="${imgs[idx].src}" alt="">
      <div class="lb-caption" id="lb-cap">${imgs[idx].title||''}</div>
    </div>
    <button class="lb-nav lb-next" id="lb-next">›</button>
    <div class="lb-counter" id="lb-ctr">${idx+1} / ${imgs.length}</div>`;
  document.body.appendChild(lb);
  lb.querySelector('.lb-bg').addEventListener('click',()=>lb.remove());
  function go(n){ idx=(n+imgs.length)%imgs.length; lb.querySelector('#lb-img').src=imgs[idx].src; lb.querySelector('#lb-cap').textContent=imgs[idx].title||''; lb.querySelector('#lb-ctr').textContent=(idx+1)+' / '+imgs.length; }
  lb.querySelector('#lb-prev').addEventListener('click',()=>go(idx-1));
  lb.querySelector('#lb-next').addEventListener('click',()=>go(idx+1));
  document.addEventListener('keydown',function kh(e){
    if(e.key==='Escape'){lb.remove();document.removeEventListener('keydown',kh);}
    else if(e.key==='ArrowLeft') go(idx-1);
    else if(e.key==='ArrowRight') go(idx+1);
  });
  if(imgs.length<=1){ lb.querySelector('#lb-prev').style.display='none'; lb.querySelector('#lb-next').style.display='none'; }
}

function getDeskData(){
  try{ return JSON.parse(localStorage.getItem('aar_desk')||'null')||DEFAULT_DESK_DATA; }
  catch(_){ return DEFAULT_DESK_DATA; }
}

function deskFolderSvg(ico){
  return DESK_ICONS[ico]||DESK_ICONS.grid;
}

function deskFolderAction(action){
  if(!action) return '';
  const [type,id]=action.split(':');
  if(type==='category') return `openCategory('${id}')`;
  return `openFolder('${id}')`;
}

function renderDesktopFolders(){
  const data=getDeskData();
  const container=document.getElementById('desk-dynamic-folders');
  if(!container) return;
  const bySection={};
  data.sections.forEach(s=>{ bySection[s]=[]; });
  data.folders.forEach(f=>{
    if(!bySection[f.section]) bySection[f.section]=[];
    bySection[f.section].push(f);
  });
  container.innerHTML=data.sections.map(sec=>{
    const folders=bySection[sec]||[];
    if(!folders.length) return '';
    return `<div class="desk-section">
      <div class="desk-section-label">${sec}</div>
      <div class="desk-folders-row">
        ${folders.map(f=>`<div class="d-folder" onclick="${deskFolderAction(f.action)}">
          <div class="d-folder-ico" style="background:linear-gradient(145deg,${f.c1},${f.c2});border-radius:14px;width:54px;height:54px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" width="28" height="28">${deskFolderSvg(f.icon)}</svg>
          </div>
          <span class="d-folder-label">${f.label}</span>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

document.getElementById('admin-submit').addEventListener('click',()=>{
  const v=document.getElementById('admin-pwd').value;
  if(v===ADMIN_PWD){ sessionStorage.setItem('aar-auth','1'); window.location.href='admin.html'; }
  else{ document.getElementById('admin-err').style.display='block'; }
});
document.getElementById('admin-pwd').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('admin-submit').click();
});
document.getElementById('admin-cancel').addEventListener('click',()=>{
  document.getElementById('win-admin-overlay').style.display='none';
  document.getElementById('admin-err').style.display='none';
  document.getElementById('admin-pwd').value='';
});
